<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>ACADEMIA</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)"><link rel="icon" type="image/png" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ACADEMIA">
<style>
/* =====================================================================
   ACADEMIA · sistema de diseño
   Superficies planas, un solo color de señal (--accent) reservado para lo
   que está pasando ahora, números tabulares y movimiento con resortes.
   Verde = logrado, naranja = por mejorar. Rojo solo para acciones destructivas.
   ===================================================================== */
:root{color-scheme:light dark;
  --bg:light-dark(#f2f2f7,#000000);--s1:light-dark(#ffffff,#1c1c1e);--s2:light-dark(#f2f2f7,#2c2c2e);--s3:light-dark(#e5e5ea,#3a3a3c);
  --tx:light-dark(#000000,#ffffff);--mu:light-dark(#636366,#98989f);--bd:light-dark(#d1d1d6,#38383a);
  --accent:#0071e3;--accent-tx:light-dark(#0062c4,#64acff);--on-accent:#ffffff;
  --ok:light-dark(#126c37,#30d158);--wn:light-dark(#9a4a08,#ff9f0a);--er:light-dark(#bd241d,#ff6961);
  --r1:12px;--r2:18px;--r3:28px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --top-h:52px;--nav-h:64px;--rail:224px;
  --font:-apple-system,"SF Pro Text","SF Pro Display",BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",system-ui,sans-serif;
  --spring:cubic-bezier(.32,.72,0,1);--mat:color-mix(in srgb,var(--s1) 74%,transparent);
  --hair:light-dark(rgba(60,60,67,.2),rgba(84,84,88,.6));--lift:0 10px 30px -12px rgba(0,0,0,.28);
  /* alias de nombres anteriores */
  --ink:var(--tx);--mut:var(--mu);--line:var(--bd);--card:var(--s1);--acc:var(--accent);
  --okbg:color-mix(in srgb,var(--ok) 13%,var(--s1));--mej:var(--wn);--mejbg:color-mix(in srgb,var(--wn) 13%,var(--s1))}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
:root[data-accent=cobalto]{--accent:#5856d6;--accent-tx:light-dark(#4a48c4,#a3a1ff)}
:root[data-accent=jade]{--accent:#1c7f36;--accent-tx:light-dark(#166a2c,#4cd26d)}
:root[data-accent=violeta]{--accent:#9a3fd0;--accent-tx:light-dark(#8030b8,#d29cff)}
:root[data-accent=rosa]{--accent:#d6174a;--accent-tx:light-dark(#b9103d,#ff7a9c)}
:root[data-accent=naranja]{--accent:#d9650b;--accent-tx:light-dark(#b45309,#ffb35c)}
*,*::before,*::after{box-sizing:border-box}[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--sat) + var(--top-h) + 12px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 var(--font);letter-spacing:-.016em;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}button{font:inherit;color:inherit}
button:not([class]){display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 18px;border:0;border-radius:14px;background:color-mix(in srgb,var(--accent) 12%,var(--s1));color:var(--accent-tx);font-weight:600;cursor:pointer}b,strong{font-weight:600}
.skip{position:absolute;left:8px;top:-60px;z-index:100;background:var(--tx);color:var(--bg);padding:10px 14px;border-radius:var(--r1);font-weight:600}.skip:focus{top:calc(var(--sat) + 8px)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::selection{background:color-mix(in srgb,var(--accent) 35%,transparent)}a{color:var(--accent-tx)}

/* ---------- Estructura ---------- */
.top{position:sticky;top:0;z-index:20;padding-top:var(--sat);background:var(--mat);backdrop-filter:saturate(1.8) blur(26px);-webkit-backdrop-filter:saturate(1.8) blur(26px);border-bottom:.5px solid transparent;transition:border-color .25s}
.top.sc{border-bottom-color:var(--hair)}
.top-in{max-width:760px;margin:0 auto;height:var(--top-h);padding:0 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative}
.brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:650;letter-spacing:-.022em;margin:0;transition:opacity .2s}
.brand .mk{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--on-accent);background:linear-gradient(150deg,color-mix(in srgb,var(--accent) 82%,#fff),color-mix(in srgb,var(--accent) 72%,#000));box-shadow:inset 0 .5px 0 rgba(255,255,255,.35)}
.brand .mk .ic{width:15px;height:15px;stroke-width:2.4}
#dt{color:var(--mu);font-size:13px;font-weight:500;transition:opacity .2s}#dt::first-letter{text-transform:uppercase}
#ttl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:56%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:17px;font-weight:650;letter-spacing:-.022em;opacity:0;pointer-events:none;transition:opacity .2s}
.top.sc #ttl{opacity:1}.top.sc .brand,.top.sc #dt{opacity:0}
main{max-width:760px;margin:0 auto;padding:6px 16px calc(var(--nav-h) + var(--sab) + 36px);outline:0}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;padding:7px 4px calc(3px + var(--sab));background:var(--mat);backdrop-filter:saturate(1.8) blur(26px);-webkit-backdrop-filter:saturate(1.8) blur(26px);border-top:.5px solid var(--hair)}
.nav-brand{display:none}
.nav a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:3px 2px 2px;color:var(--mu);font-size:10.5px;font-weight:500;line-height:1.1;text-decoration:none;background:transparent}
.nav .nv{display:grid;place-items:center}.nav .ic{width:26px;height:26px;stroke-width:1.7;transition:transform .5s var(--spring)}
.nav a:active .ic{transform:scale(.86)}.nav a[aria-current=page]{color:var(--accent-tx);font-weight:600}.nav a[aria-current=page] .ic{stroke-width:2.15}
@media(min-width:900px){
  #app{padding-left:var(--rail)}
  .nav{top:0;right:auto;bottom:0;width:var(--rail);flex-direction:column;justify-content:flex-start;gap:4px;padding:calc(20px + var(--sat)) 12px 18px;border-top:0;border-right:.5px solid var(--hair)}
  .nav-brand{display:flex;margin:0 6px 18px}
  .nav a{flex:none;flex-direction:row;gap:11px;padding:8px 12px;border-radius:11px;font-size:15px}.nav .ic{width:22px;height:22px}
  .nav a[aria-current=page]{background:color-mix(in srgb,var(--accent) 14%,transparent)}.nav a:hover:not([aria-current=page]){background:color-mix(in srgb,var(--mu) 12%,transparent)}
  .top-in .brand,#ttl{display:none}.top-in,main{max-width:820px}main{padding-bottom:60px}.top.sc #dt{opacity:1}
}

/* ---------- Iconos y tipografía ---------- */
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}.ic.fill{fill:currentColor;stroke-width:1}
h2,.pg{text-wrap:balance;font-size:clamp(25px,7.6vw,34px);font-weight:700;letter-spacing:-.034em;line-height:1.08;margin:8px 2px 4px}
h3{font-size:17px;font-weight:600;letter-spacing:-.02em;margin:0 0 6px}p{margin:8px 0}
.lb{display:block;font-size:12.5px;font-weight:500;color:var(--mu)}.mu,.mut{color:var(--mu);font-size:13px;line-height:1.45}
.ok{color:var(--ok)}.wn{color:var(--wn)}.er{color:var(--er)}.tn{font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row.nw{flex-wrap:nowrap}.sp{justify-content:space-between}.grow{flex:1;min-width:0}
.mt{margin-top:12px}.mt2{margin-top:20px}.sec{margin:30px 16px 8px;font-size:13px;font-weight:600;color:var(--mu)}
.voz{font-size:15px;margin:8px 4px 6px;color:var(--mu)}.voz b{color:var(--tx);font-weight:600}
hr{border:0;border-top:.5px solid var(--hair);margin:16px 0}code{background:var(--s2);padding:1px 6px;border-radius:6px;font-size:.9em}
small{font-size:12.5px}

/* ---------- Superficies ---------- */
.card{position:relative;background:var(--s1);border:0;border-radius:22px;padding:18px;margin:12px 0}
.card.in{background:var(--s2)}a.card{display:block;text-decoration:none;color:inherit}
.lst{background:var(--s1);border-radius:22px;margin:8px 0 16px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:13px 16px;min-height:54px;position:relative;color:inherit;text-decoration:none;width:100%;border:0;background:transparent;text-align:left}
.li+.li::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--hair)}
a.li:active,button.li:active{background:var(--s2)}.li .ic.r{color:var(--mu);width:16px;height:16px}
.li select,.li input[type=text],.li input[type=color]{width:auto;max-width:56%;margin:0;padding:0;min-height:36px;background:transparent;text-align:right;color:var(--accent-tx);font-size:16px;box-shadow:none;flex:none}
.li input[type=text]{flex:1;max-width:none}.li input[type=color]{width:44px;height:30px;padding:0;border-radius:8px;cursor:pointer}
.ct{width:40px;height:40px;border-radius:11px;background:color-mix(in srgb,var(--ac,var(--accent)) 16%,var(--s1));display:grid;place-items:center;font-size:21px;flex:none}
.menu{display:grid;gap:0;border-radius:22px;overflow:hidden;background:var(--s1);margin:10px 0}
.menu button,.menu a{display:flex;align-items:center;gap:14px;width:100%;min-height:52px;padding:0 16px;border:0;background:transparent;color:var(--tx);font-size:16px;font-weight:500;text-align:left;cursor:pointer;text-decoration:none}
.menu>*+*{box-shadow:inset 0 .5px 0 var(--hair)}.menu button:active,.menu a:active{background:var(--s2)}.menu .ic{color:var(--accent-tx)}.menu .dg,.menu .dg .ic{color:var(--er)}
details.fold{margin:10px 0;border-radius:22px;background:var(--s1)}
details.fold>summary,details.card>summary{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:15px 18px;cursor:pointer;list-style:none;font-weight:600;font-size:15.5px;min-height:48px}
details.fold>summary::-webkit-details-marker,details.card>summary::-webkit-details-marker{display:none}
details.fold>summary::after,details.card>summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--mu);border-bottom:2px solid var(--mu);transform:rotate(45deg) translateY(-2px);transition:transform .2s}
details.fold[open]>summary::after,details.card[open]>summary::after{transform:rotate(-135deg)}details.fold>.fb{padding:0 18px 14px}
details.card{padding:0}details.card>*:not(summary){margin-left:18px;margin-right:18px}details.card>*:last-child{margin-bottom:16px}
.notas textarea{width:calc(100% - 36px)}

/* ---------- Botones ---------- */
.btn,button.pri{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:50px;padding:0 22px;border:0;border-radius:15px;background:var(--accent);color:var(--on-accent);font-size:16px;font-weight:600;letter-spacing:-.015em;text-decoration:none;cursor:pointer;transition:transform .45s var(--spring),filter .2s,opacity .2s}
.btn:active,button.pri:active{transform:scale(.955);filter:brightness(.93);transition-duration:.08s}
.btn[disabled],button[disabled]{opacity:.45;pointer-events:none}
.btn.s,button.s{background:color-mix(in srgb,var(--accent) 12%,var(--s1));color:var(--accent-tx)}
.btn.pri,.btn.a{background:var(--accent);color:var(--on-accent)}
.btn.t{background:transparent;color:var(--accent-tx);padding:0 10px}.btn.d,button.d{background:color-mix(in srgb,var(--er) 12%,var(--s1));color:var(--er)}
.btn.sm{min-height:36px;padding:0 16px;font-size:14px;border-radius:999px}.btn.blk{width:100%}
.back{display:inline-flex;align-items:center;gap:2px;min-height:36px;margin:2px 0 0 -6px;padding:0 8px;color:var(--accent-tx);text-decoration:none;font-size:16px}.back .ic{width:18px;height:18px}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--s1);color:var(--accent-tx);text-decoration:none;flex:none}
.pill{min-height:40px;padding:0 16px;border:0;border-radius:999px;background:color-mix(in srgb,var(--accent) 12%,var(--s1));color:var(--accent-tx);font-weight:600;font-size:15px;cursor:pointer;transition:transform .3s var(--spring)}.pill:active{transform:scale(.95)}
.pill.on{background:var(--accent);color:var(--on-accent)}
.chip,.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:999px;background:color-mix(in srgb,var(--mu) 15%,transparent);color:light-dark(#48484d,#b8b8bf);font-size:12px;font-weight:600;white-space:nowrap}
.chip.ok,.tag.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--s1))}.chip.wn,.tag.mej{color:var(--wn);background:color-mix(in srgb,var(--wn) 14%,var(--s1))}.chip.ac{background:var(--accent);color:var(--on-accent)}.chip .ic,.tag .ic{width:13px;height:13px}
.seg{display:flex;gap:2px;padding:2px;border-radius:10px;background:color-mix(in srgb,var(--mu) 18%,transparent);margin:8px 0}
.seg button{flex:1;min-height:34px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:color-mix(in srgb,var(--tx) 78%,transparent);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .25s var(--spring)}
.seg button[aria-pressed=true]{background:light-dark(#fff,#636366);color:var(--tx);box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.05)}

/* ---------- Formularios ---------- */
input,select,textarea{display:block;width:100%;min-height:46px;margin:0 0 12px;padding:0 13px;border:0;border-radius:12px;background:var(--s2);color:var(--tx);font:inherit;font-size:17px;transition:box-shadow .2s}
textarea{padding:11px 13px;min-height:0;resize:vertical}input:focus,select:focus,textarea:focus{outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 38%,transparent)}
label{display:block}label.opt{display:flex}label.li{cursor:pointer}
.qa{display:flex;align-items:center;gap:6px;padding:4px 4px 4px 16px;border-radius:16px;margin:12px 0 4px;background:var(--s1);box-shadow:0 0 0 .5px var(--hair)}.qa:focus-within{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 38%,transparent)}
.qa .ic{color:var(--accent-tx)}.qa input{flex:1;min-width:0;margin:0;padding:0;min-height:42px;background:transparent!important;box-shadow:none!important}
input.sw{appearance:none;-webkit-appearance:none;width:51px;min-height:0;height:31px;margin:0;padding:0;border-radius:31px;position:relative;flex:none;cursor:pointer;background:color-mix(in srgb,var(--mu) 32%,transparent);transition:background .25s}
input.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.25),0 0 0 .5px rgba(0,0,0,.06);transition:transform .35s var(--spring)}
input.sw:checked{background:var(--ok)}input.sw:checked::after{transform:translateX(20px)}
.opt{align-items:flex-start;gap:12px;padding:12px 14px;margin:8px 0;border-radius:14px;background:var(--s2);cursor:pointer;min-height:48px;line-height:1.35;transition:background .2s,box-shadow .2s}
.opt input{appearance:none;-webkit-appearance:none;display:grid;place-content:center;width:22px;height:22px;min-height:0;margin:1px 0 0;padding:0;border-radius:50%;border:2px solid color-mix(in srgb,var(--mu) 55%,transparent);flex:none;background:transparent;box-shadow:none}
.opt input[type=checkbox]{border-radius:7px}.opt input:checked{background:var(--accent);border-color:var(--accent);box-shadow:none}
.opt input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.2px 2.2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.opt:has(input:checked){background:color-mix(in srgb,var(--accent) 12%,var(--s1));box-shadow:inset 0 0 0 1.5px var(--accent)}

/* ---------- Avisos ---------- */
.al,.warn{display:block;margin:10px 0;padding:14px 16px;border-radius:18px;font-size:14.5px;line-height:1.42;background:color-mix(in srgb,var(--wn) 13%,var(--s1))}
.al.g{background:color-mix(in srgb,var(--ok) 12%,var(--s1))}.al.e{background:color-mix(in srgb,var(--er) 11%,var(--s1))}.al .btn{margin-top:8px}

/* ---------- Medidas: barras, anillo, calor ---------- */
.bar{height:6px;border-radius:6px;background:var(--s3);overflow:hidden;margin:8px 0}.bar>i{display:block;height:100%;width:0;background:var(--ok);border-radius:inherit;transition:width .5s var(--spring)}.bar.ac>i{background:var(--accent)}
.cb{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:14px}.cb .nm{width:104px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cb .bar{flex:1;margin:0}.cb .v{width:44px;text-align:right;color:var(--mu)}
.ring{display:block;flex:none;color:var(--tx)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);grid-auto-columns:1fr;gap:3px}.heat i{aspect-ratio:1;border-radius:4px;background:var(--s3);min-width:0}
.heat i.l1{background:color-mix(in srgb,var(--ok) 30%,var(--s3))}.heat i.l2{background:color-mix(in srgb,var(--ok) 55%,var(--s3))}.heat i.l3{background:color-mix(in srgb,var(--ok) 80%,var(--s3))}.heat i.l4{background:var(--ok)}.heat i.now{outline:2px solid var(--tx);outline-offset:1px}.heat i.vo{visibility:hidden}
.wbars{display:flex;align-items:stretch;gap:8px;height:120px;margin:10px 0 4px}.wbars>div{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--mu)}
.wbars .trk{flex:1;width:100%;max-width:34px;display:flex;align-items:flex-end;min-height:0}.wbars i{display:block;width:100%;background:var(--accent);border-radius:6px 6px 3px 3px;min-height:3px}.wbars i.z{background:var(--s3)}
.wk7{display:flex;gap:6px}.wk7 span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--mu);background:var(--s3)}.wk7 span.on{background:var(--ok);color:#fff}.wk7 span.now{outline:2px solid var(--accent);outline-offset:1.5px}
.sum{display:flex;align-items:center;gap:16px;padding:20px}.sum .n{font-size:54px;font-weight:700;letter-spacing:-.055em;line-height:1;font-variant-numeric:tabular-nums}.sum .n small{font-size:22px;color:var(--mu);font-weight:600;letter-spacing:-.03em;margin-left:3px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.tile{background:var(--s1);border-radius:18px;padding:14px 8px;text-align:center}.tile b{display:block;font-size:24px;font-weight:700;letter-spacing:-.04em;line-height:1.15;font-variant-numeric:tabular-nums}.tile small{color:var(--mu)}
.hero{position:relative;overflow:hidden;color:#f5f5f7;border-radius:30px;padding:24px 22px 22px;margin:14px 0;box-shadow:var(--lift);background:radial-gradient(130% 95% at 100% 0%,color-mix(in srgb,var(--ac,var(--accent)) 46%,transparent),transparent 62%),linear-gradient(165deg,#2a2a30,#0e0e11)}
.hero .lb,.hero .mu{color:rgba(245,245,247,.66)}.hero .name{font-size:28px;font-weight:700;letter-spacing:-.035em;line-height:1.1;margin:4px 0 8px;overflow-wrap:anywhere}.hero .bar{background:rgba(255,255,255,.2)}.hero .bar>i{background:var(--accent)}.hero .btn{margin-top:6px}

/* ---------- Línea de tiempo de unidades ---------- */
.tl{padding:18px 16px 4px}.tr{display:grid;grid-template-columns:50px 22px minmax(0,1fr);column-gap:8px;position:relative}
.tr .tm{text-align:right;font-size:12.5px;line-height:1.3;color:var(--mu);padding-top:3px;font-variant-numeric:tabular-nums}.tr .tm b{display:block;color:var(--tx);font-weight:600;font-size:14px}
.tr .spn{position:relative}.tr .spn::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:color-mix(in srgb,var(--mu) 22%,transparent)}
.tr:first-child .spn::before{top:12px}.tr:last-child .spn::before{bottom:auto;height:12px}
.tr .nd{position:absolute;left:50%;top:5px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--s1);border:3px solid color-mix(in srgb,var(--mu) 55%,transparent);z-index:1}
.tr .bdy{padding:0 0 20px;min-width:0}.tr .ttl{display:block;font-size:17px;font-weight:600;letter-spacing:-.02em;line-height:1.25;color:var(--tx);text-decoration:none;overflow-wrap:anywhere}
.tr.done .nd{background:var(--ok);border-color:var(--ok)}.tr.done .nd::after{content:"";position:absolute;left:3px;top:.5px;width:4px;height:7px;border:solid var(--s1);border-width:0 2px 2px 0;transform:rotate(45deg)}

<script>
'use strict';
/* ============ 1. CONFIGURACIÓN ============ */
const DB_NAME = 'academia-ingles-v1', LS_KEY = 'academia-ingles-v1:estado';
/* Modo embebido (opcional): build.py coloca aquí uno o varios .md. Lo importado gana en conflictos. */
const COURSE_MD = ``;
const METAS = {academic:'IELTS Academic', general:'IELTS General', toefl:'TOEFL iBT'};
const PASOS = ['Objetivos','Repaso rápido','Vocabulario','Gramática','Texto o diálogo modelo','Cuidado','Módulo de examen','Ejercicios','Hablar y escribir','Lista de verificación','Tarea de aplicación','Evaluación de la unidad'];
const Q_TIPOS = ['mcq','mcq-multi','tfng','ynng','fill','fillbank','match','short','order','label','repeat','open','speak','write'];
const Q_ABIERTAS = ['open','speak','write'];
const BLOQUES = ['box','vocab','pron','table','passage','audio','image','chart','process','q','checklist','model-answer','exam'];

/* ============ 2. UTILIDADES ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
const pad2 = n => String(n).padStart(2,'0');
function inline(t){
  let s = esc(t);
  s = s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g,'$1<i>$2</i>');
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  return s.replace(/VERIFICAR/g,'<a class="verif" href="#/nota-verificar">VERIFICAR<small> en el sitio oficial</small></a>');
}
function md(text){
  const L = String(text).split('\n'); let out = '', i = 0;
  while(i < L.length){
    const l = L[i];
    if(!l.trim()){ i++; continue; }
    if(/^\s*\|/.test(l)){ const r=[]; while(i<L.length && /^\s*\|/.test(L[i])) r.push(L[i++]); out += renderTabla(parseTabla(r)); continue; }
    let m;
    if((m=/^(#{2,6})\s+(.*)$/.exec(l))){ out += `<h3>${inline(m[2])}</h3>`; i++; continue; }
    if(/^\s*[-*]\s+/.test(l)){ out+='<ul>'; while(i<L.length && /^\s*[-*]\s+/.test(L[i])) out+=`<li>${inline(L[i++].replace(/^\s*[-*]\s+/,''))}</li>`; out+='</ul>'; continue; }
    if(/^\s*\d+[.)]\s+/.test(l)){ out+='<ol>'; while(i<L.length && /^\s*\d+[.)]\s+/.test(L[i])) out+=`<li>${inline(L[i++].replace(/^\s*\d+[.)]\s+/,''))}</li>`; out+='</ol>'; continue; }
    const p=[]; while(i<L.length && L[i].trim() && !/^\s*(\||[-*]\s|\d+[.)]\s|#)/.test(L[i])) p.push(L[i++]);
    if(!p.length){ p.push(L[i++]); }
    out += `<p>${inline(p.join(' '))}</p>`;
  }
  return out;
}

/* ============ 3. PARSER (Formato Academia) ============ */
/*PARSER-START*/
/* Atributos clave=valor con o sin comillas (rectas o tipográficas) */
function parseAttrs(s){
  const a = {}, re = /([\w-]+)\s*=\s*(?:"([^"]*)"|“([^”]*)”|'([^']*)'|([^\s"“']+))/g; let m;
  while((m = re.exec(s||''))) a[m[1].toLowerCase()] = m[2] ?? m[3] ?? m[4] ?? m[5] ?? '';
  return a;
}
function parseMetaLine(s){ const o={}; String(s).split('|').forEach(p=>{ const m=/^\s*([\w-]+)\s*=\s*(.*?)\s*$/.exec(p); if(m) o[m[1].toLowerCase()]=m[2]; }); return o; }

/* Tabla Markdown con {colspan=n}/{rowspan=n} al inicio de la celda */
function parseTabla(rows){
  const out = [];
  rows.forEach(r=>{
    if(/^\s*\|?[\s:|-]+\|?\s*$/.test(r) && /-/.test(r)) return;
    const cells = r.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>{
      c = c.trim(); let cs=1, rs=1;
      const m = /^\{([^}]*)\}\s*/.exec(c);
      if(m){ const a=parseAttrs(m[1]); cs=+a.colspan||1; rs=+a.rowspan||1; c=c.slice(m[0].length); }
      return {t:c, cs, rs};
    });
    out.push(cells);
  });
  return out;
}
function renderTabla(rows){
  if(!rows.length) return '';
  const row = (r,h) => '<tr>'+r.map(c=>`<${h?'th':'td'}${c.cs>1?` colspan="${c.cs}"`:''}${c.rs>1?` rowspan="${c.rs}"`:''}>${inline(c.t)}</${h?'th':'td'}>`).join('')+'</tr>';
  return `<div class="tw"><table><thead>${row(rows[0],true)}</thead><tbody>${rows.slice(1).map(r=>row(r,false)).join('')}</tbody></table></div>`;
}

const CAMPOS = {
  q: ['stem','options','answer','accept','limit','bank','pairs','items','target','turns','rubric','key_ideas','min_words','time_sec','sample','explain'],
  pron: ['tip','pares'], audio: ['speakers'], image: ['prompt','uso'], chart: ['labels','series']
};
/* Lee campos "nombre: valor" con líneas de continuación; "series" puede repetirse */
function parseCampos(tipo, body){
  const set = CAMPOS[tipo], re = new RegExp('^\\s*('+set.join('|')+')\\s*:\\s*(.*)$','i');
  const f = {}; let cur = null; const extra = [];
  body.forEach(l=>{
    const m = re.exec(l);
    if(m){ cur = m[1].toLowerCase(); if(cur==='series'){ (f.series ||= []).push(m[2]); } else f[cur] = m[2]; }
    else if(cur && cur!=='series' && l.trim()) f[cur] += '\n'+l.trim();
    else if(l.trim()) extra.push(l);
  });
  return {f, extra};
}
const lista = s => String(s||'').split(/[,;\n]/).map(x=>x.trim()).filter(Boolean);

function parseBloque(tipo, attrs, body){
  const b = {type:tipo, attrs, id:attrs.id||null, raw:body.join('\n')};
  if(tipo==='q'){
    const {f} = parseCampos('q', body);
    b.qtype = (attrs.type||'').toLowerCase(); b.f = f;
    b.options = []; const re=/(?:^|\n)\s*[-*]?\s*\(?([a-hA-H])[).]\s+(.*)/g; let m;
    while((m=re.exec(f.options||''))) b.options.push({k:m[1].toLowerCase(), t:m[2].trim()});
    b.accept = lista(f.accept);
    const mw = /\d+/.exec(f.min_words||''); b.minWords = mw ? +mw[0] : null;
    const ts = /time_sec\s*[:=]?\s*(\d+)/i.exec((f.min_words||'')+' '+(f.time_sec||'')) || /^\s*(\d+)/.exec(f.time_sec||'');
    b.timeSec = ts ? +ts[1] : null;
  } else if(tipo==='audio'){
    const {f} = parseCampos('audio', body); b.speakers = f.speakers||''; b.turns = [];
    body.forEach(l=>{ const m=/^\s*([A-Za-z]):\s*(.*)$/.exec(l); if(m) b.turns.push({who:m[1].toUpperCase(), text:m[2]}); });
  } else if(tipo==='pron'){
    const {f} = parseCampos('pron', body); b.tip=f.tip||''; b.pares=lista(f.pares).map(p=>p.split(/\s*[-–]\s*/));
  } else if(tipo==='image'){ b.f = parseCampos('image', body).f;
  } else if(tipo==='chart'){
    const {f} = parseCampos('chart', body); b.labels = lista(f.labels);
    b.series = (f.series||[]).map(s=>{ const m=/^\s*(.*?)\s*=\s*(.*)$/.exec(s); return m ? {name:m[1], vals:lista(m[2]).map(Number)} : {name:'', vals:lista(s).map(Number)}; });
  } else if(tipo==='vocab'){
    b.rows = body.filter(l=>l.trim() && l.includes('|')).map(l=>{ const c=l.split('|').map(x=>x.trim()); return {term:c[0],ipa:c[1]||'',es:c[2]||'',ex:c[3]||'',col:c[4]||''}; });
  } else if(tipo==='table'){ b.rows = parseTabla(body.filter(l=>/^\s*\|/.test(l)));
  } else if(tipo==='process'){ b.steps = body.filter(l=>/^\s*\d+[.)]/.test(l)).map(l=>l.replace(/^\s*\d+[.)]\s*/,''));
  } else if(tipo==='checklist'){ b.items = body.filter(l=>l.trim()).map(l=>l.replace(/^\s*[-*]\s*(\[[ xX]\]\s*)?/,'').trim());
  } else if(tipo==='exam'){ b.refs = (b.raw.match(/\b[A-Z]{1,3}\d*-[A-Z0-9]+-?[A-Z]*\d+\b/g)||[]).filter(x=>x!==b.id);
  } else if(tipo==='passage'){ b.text = body.join('\n').trim(); }
  else b.text = body.join('\n').trim();
  return b;
}

/* Divide un archivo en paquetes: documento, portada o unidades sueltas */
function dividirPaquetes(texto){
  const L = texto.replace(/\r/g,'').split('\n'); let dentro=false; const heads=[];
  L.forEach((l,i)=>{
    if(dentro){ if(/^\s*:::\s*$/.test(l)) dentro=false; return; }
    if(/^\s*:::\s*[A-Za-z]/.test(l)){ dentro=true; return; }
    const m=/^#\s+(?!#)(.+)$/.exec(l); if(!m) return; const t=m[1].trim();
    const k = /^DOCUMENTO\s+[ABC][12]\b/i.test(t)?'doc' : /^PORTADA/i.test(t)?'portada' : /^Unidad\s+\d+/i.test(t)?'unit' : null;
    if(k) heads.push({i,k,t});
  });
  if(!heads.length) return {error:'No se reconoció ningún encabezado (# DOCUMENTO …, # PORTADA …, # Unidad N).', packs:[]};
  const segs=[]; let cur=null;
  heads.forEach(h=>{ if(h.k==='unit' && cur && cur.k==='doc') return; cur={...h}; segs.push(cur); });
  const packs = segs.map((s,j)=>{
    const fin = j+1<segs.length ? segs[j+1].i : L.length, md = L.slice(s.i,fin).join('\n');
    if(s.k==='doc'){ const id=/([ABC][12])/i.exec(s.t)[1].toUpperCase(), pt=+(/parte\s*(\d+)/i.exec(s.t)||[])[1]||1; return {key:'DOC:'+id+(pt>1?'#'+pt:''), kind:'doc', id, parte:pt, md}; }
    if(s.k==='portada') return {key:'PORTADA', kind:'portada', id:'PORTADA', md};
    const n=+/Unidad\s+(\d+)/i.exec(s.t)[1]; return {key:'UNIT:'+pad2(n), kind:'unit', id:n, md};
  });
  return {packs};
}

/* Analiza un paquete → estructura de documento/unidades/secciones/bloques */
function parsePaquete(pack){
  const L = pack.md.replace(/\r/g,'').split('\n');
  const r = {key:pack.key, kind:pack.kind, id:pack.id, meta:{}, units:[], docSections:[], blocks:[], warn:[]};
  let unit=null, sec=null, buf=[];
  const flush = () => { const t=buf.join('\n').trim(); if(t && sec) sec.items.push({t:'md', text:t}); buf=[]; };
  const nueva = (title, doc) => { flush(); sec={title, doc, items:[]}; (doc||!unit ? r.docSections : unit.sections).push(sec); };
  for(let i=0; i<L.length; i++){
    const l = L[i]; let m;
    if((m=/^\s*:::\s*([A-Za-z][\w-]*)\s*(.*)$/.exec(l))){
      const tipo = m[1].toLowerCase(), attrs = parseAttrs(m[2]), body=[]; i++;
      while(i<L.length && !/^\s*:::\s*$/.test(L[i])) body.push(L[i++]);
      if(i>=L.length) r.warn.push(`Bloque :::${tipo}${attrs.id?' '+attrs.id:''} sin cierre ":::" al final del archivo`);
      if(!sec){ flush(); sec={title:'(inicio)',doc:!unit,items:[]}; (unit?unit.sections:r.docSections).push(sec); }
      flush();
      const b = parseBloque(tipo, attrs, body); b.unit = sec.doc ? null : unit?.n ?? null;
      if(!BLOQUES.includes(tipo)) r.warn.push(`Bloque desconocido :::${tipo}${attrs.id?' ('+attrs.id+')':''}; se muestra de forma genérica`);
      sec.items.push({t:'block', b}); r.blocks.push(b); continue;
    }
    if(/^#\s+(?!#)/.test(l)){
      flush();
      if((m=/^#\s+Unidad\s+(\d+)\.?\s*(.*)$/i.exec(l))){ unit={n:+m[1], title:m[2].trim(), meta:{}, sections:[]}; r.units.push(unit); sec=null; }
      else if(/^#\s+(DOCUMENTO|PORTADA)/i.test(l)){ r.title=l.replace(/^#\s+/,'').trim(); sec=null; }
      else { unit=null; nueva(l.replace(/^#\s+/,'').trim(), true); }
      continue;
    }
    if((m=/^##\s+(.*)$/.exec(l))){ const t=m[1].trim(); nueva(t, !unit || /prueba de logro|glosario/i.test(t)); continue; }
    if(!sec && (m=/^meta:\s*(.*)$/i.exec(l))){ (unit ? unit.meta : r.meta) && Object.assign(unit ? unit.meta : r.meta, parseMetaLine(m[1])); continue; }
    if(/^\s*FIN DEL CURSO\s*$/i.test(l)) continue;
    if(!sec && !l.trim()) continue;
    if(!sec){ sec={title:'(inicio)',doc:!unit,items:[]}; (unit?unit.sections:r.docSections).push(sec); }
    buf.push(l);
  }
  flush();
  return r;
}

/* Un documento puede llegar en partes ("# DOCUMENTO A1 · parte 2/3"): se unen en orden antes de analizarlo */
function unirPartes(packsMap){
  const out = new Map(), partes = [], av = [];
  packsMap.forEach(p=>{ if(p.kind==='doc' && (p.parte||1)>1) partes.push(p); else out.set(p.key, {...p}); });
  partes.sort((a,b)=>a.parte-b.parte).forEach(p=>{
    const base = out.get('DOC:'+p.id), cuerpo = p.md.split('\n').slice(1).join('\n');
    if(base) base.md += '\n'+cuerpo; else { out.set('DOC:'+p.id, {...p, key:'DOC:'+p.id}); av.push({where:'Documento '+p.id, msg:`Falta la parte 1 (la que trae "# DOCUMENTO ${p.id}" y la guía de uso)`}); }
  });
  return {out, av};
}
function construirCurso(packsMap){
  const c = {parsed:[], units:new Map(), docs:new Map(), portada:null, byId:new Map(), dup:[], warn:[]};
  const orden = {doc:0, portada:1, unit:2};
  const um = unirPartes(packsMap); um.av.forEach(x=>c.warn.push(x));
  [...um.out.values()].sort((a,b)=>orden[a.kind]-orden[b.kind] || String(a.key).localeCompare(b.key)).forEach(p=>{
    const r = parsePaquete(p); c.parsed.push(r);
    if(p.kind==='portada') c.portada = r;
    if(p.kind==='doc') c.docs.set(p.id, r);
    r.units.forEach(u=>{
      if(c.units.has(u.n)) c.warn.push({where:'Unidad '+u.n, msg:`Aparece dos veces (${c.units.get(u.n).from} y ${p.key}); se usa ${p.key}`});
      c.units.set(u.n, {...u, from:p.key, doc:p.kind==='doc'?p.id:null});
    });
    r.blocks.forEach(b=>{
      if(!b.id) return;
      if(c.byId.has(b.id)) c.dup.push(b.id); else c.byId.set(b.id, b);
    });
  });
  return c;
}
const normTit = s => norm(s).replace(/^\d+\s*/,'');
function validar(c){
  const w = [], add = (where,msg,lvl='aviso') => w.push({where,msg,lvl});
  c.warn.forEach(x=>add(x.where,x.msg));
  c.parsed.forEach(r=>r.warn.forEach(m=>add(r.key,m)));
  [...new Set(c.dup)].forEach(id=>add(id,'ID duplicado dentro de lo cargado'));
  const tiene = (id,tipo) => c.byId.get(id)?.type===tipo;
  const refs = {audio:'audio', passage:'passage', image:'image', chart:'chart'};
  c.parsed.forEach(r=>{
    r.units.forEach(u=>{
      const min=+u.meta.minutes; if(u.meta.minutes && (min<30||min>40)) add('Unidad '+u.n,`minutes=${u.meta.minutes} fuera de 30–40`);
      if(u.sections.length!==12) add('Unidad '+u.n,`Trae ${u.sections.length} secciones ## (se esperan 12)`);
      else u.sections.forEach((s,i)=>{ if(!normTit(s.title).startsWith(normTit(PASOS[i]).slice(0,10))) add('Unidad '+u.n,`Sección ${i+1} "${s.title}" no coincide con "${PASOS[i]}"`); });
      const rep = u.sections.find(s=>/^repaso/i.test(normTit(s.title)));
      if(rep){ const t=rep.items.map(i=>i.text||'').join(' '); (t.match(/Unidad\s+(\d+)|\bU(\d{1,2})\b/g)||[]).forEach(x=>{ const n=+x.replace(/\D/g,''); if(n>u.n) add('Unidad '+u.n,`"Repaso rápido" apunta hacia delante a la Unidad ${n}`); else if(!c.units.has(n)) add('Unidad '+u.n,`"Repaso rápido" menciona la Unidad ${n}, aún no cargada`,'info'); }); }
    });
    r.blocks.forEach(b=>{
      const id = b.id || '(sin id)';
      if(b.type==='q'){
        if(!Q_TIPOS.includes(b.qtype)) add(id,`Tipo de pregunta desconocido "${b.qtype}"`);
        const f=b.f;
        if(Q_ABIERTAS.includes(b.qtype)){ ['rubric','key_ideas'].forEach(k=>{ if(!f[k]) add(id,`Pregunta abierta sin ${k}`); }); if(!b.minWords) add(id,'Pregunta abierta sin min_words'); }
        else if(b.qtype==='repeat'){ if(!f.target) add(id,'repeat sin target'); }
        else { if(!f.answer && !(b.qtype==='match' && f.pairs)) add(id,b.qtype==='match'?'match sin pairs':'Pregunta sin answer'); if(!f.explain) add(id,'Pregunta sin explain'); }
        if(['mcq','mcq-multi'].includes(b.qtype) && b.options.length<2) add(id,'Opciones a–d no reconocidas');
        Object.entries(refs).forEach(([k,tipo])=>{ const v=b.attrs[k]; if(v && !tiene(v,tipo)) add(id,`${k}=${v} no existe en lo cargado`); });
      }
      if(b.type==='exam') b.refs.forEach(x=>{ if(!c.byId.has(x)) add(id,`El simulacro cita ${x}, que no está cargado`,'info'); });
      if(b.type==='audio' && !b.turns.length) add(id,'Audio sin turnos (A: / B:)');
      if(b.type==='chart' && !b.series.length) add(id,'Gráfico sin series');
    });
  });
  return w;
}
function contar(parsed){
  const k = {q:0, porTipo:{}, audio:0, passage:0, chart:0, image:0, table:0, vocab:0, exam:0, otros:0};
  parsed.forEach(r=>r.blocks.forEach(b=>{
    if(b.type==='q'){ k.q++; k.porTipo[b.qtype]=(k.porTipo[b.qtype]||0)+1; }
    else if(b.type==='vocab') k.vocab += b.rows.length;
    else if(k[b.type]!==undefined) k[b.type]++; else k.otros++;
  }));
  return k;
}

function limiteOk(lim, r){

function evalQ(b, r){

  switch(b.qtype){
    case 'mcq': return {ok: !!r && nz(r)===ans};
    case 'mcq-multi': { const c=ans.split(/[\s,]+/).filter(Boolean), u=r||[], falta=c.filter(x=>!u.includes(x)).length, sobra=u.filter(x=>!c.includes(x)).length;
      return {ok:u.length>0&&!falta&&!sobra, msg:u.length&&(falta||sobra)?`Te faltan ${falta} y sobran ${sobra}.`:''}; }
    case 'tfng': case 'ynng': return {ok: !!r && (nz(r)===ans || (ans==='ng' && nz(r)==='not given'))};
    case 'fill': case 'short': { const x=nz(r); if(!x) return {ok:false};
      if([f.answer,...b.accept].some(a=>nz(a)===x)) return {ok:true};
      return {ok:false, msg: limiteOk(f.limit,r) ? '' : `Pasaste el límite (${f.limit}).`}; }
    case 'fillbank': return {ok: !!r && nz(r)===ans};
    case 'match': { const pr=lista(f.pairs).map(p=>p.split('-').map(s=>s.trim())); return {ok: pr.length>0 && pr.every(([k,v])=>nz((r||{})[k])===nz(v))}; }
    case 'order': { const arr = Array.isArray(r) ? r : (r?.a||[]).map(t=>t.w), j = nz(arr.join(' ')); return {ok: j===ans || b.accept.some(a=>nz(a)===j)}; }
    case 'label': { const parts=lista(f.answer).map(p=>p.replace(/^\d+\s*-\s*/,'')); return {ok: parts.every((p,i)=>nz((r||[])[i])===nz(p))}; }
    case 'repeat': { const tg=nz(f.target).split(' '), got=new Set(nz(r).split(' ')), s=tg.filter(w=>got.has(w)).length/tg.length;
      return {ok: s>=S.ajustes.umbral, msg:`Coincidencia con el modelo: ${Math.round(s*100)}%`}; }
    default: return {ok:null};
  }
}

/* ---- Bloques ---- */

const vItems = (items, ctx) => items.map(i=>i.t==='md'?md(i.text):vBloque(i.b, ctx)).join('');

/* ---- Pregunta ---- */
function initResp(b){

}

  if(a.chart) h += chartHTML(curso.byId.get(a.chart)) ;

}
function cuerpoQ(b, r){

    case 'tfng': case 'ynng': return `<div class="row" role="group">${{tfng:['TRUE','FALSE','NOT GIVEN'],ynng:['YES','NO','NOT GIVEN']}[t].map(v=>`<button class="pill ${nz(r)===nz(v)?'on':''}" data-act="tf" data-q="${id}" data-v="${v}" aria-pressed="${nz(r)===nz(v)}">${v}</button>`).join('')}</div>`;

    case 'fillbank': return `<select data-r="v" data-q="${id}" aria-label="Elige"><option value="">—</option>${lista(f.bank).map(x=>`<option ${r===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
    case 'match': { const ks=lista(f.pairs).map(p=>p.split('-')[0].trim()), L='ABCDEFGH'.slice(0,Math.max(ks.length,3)).split('');
      return ks.map(k=>`<div class="row"><b>${esc(k)}</b><select data-r="k" data-q="${id}" data-k="${esc(k)}" aria-label="Pareja de ${esc(k)}"><option value="">—</option>${L.map(x=>`<option ${r[k]===x?'selected':''}>${x}</option>`).join('')}</select></div>`).join(''); }
    case 'order': return `<div class="oans" aria-label="Tu orden">${r.a.length?r.a.map((t,k)=>`<button class="tok on" data-act="oa" data-q="${id}" data-k="${k}">${esc(t.w)}</button>`).join(''):'<span class="mut">Toca las piezas en el orden correcto</span>'}</div><div class="obank">${r.b.map(t=>`<button class="tok" data-act="ob" data-q="${id}" data-i="${t.i}">${esc(t.w)}</button>`).join('')}</div>`;

    default: return `${(t==='speak'&&f.turns)?`<p><small>${txt(f.turns)}</small></p>`:''}<div class="row">${mic}</div>${ta(minPal(b))}`;

function feedbackQ(b, rs){

    if(rs.c) h += `<p>${esc(rs.c)}</p>`;

  } else if(rs.msg) h += `<div class="warn">${esc(rs.msg)}</div>`;
  if(rs.ok!=null && b.f.explain) h += `<p><small>${txt(b.f.explain)}</small></p>`;
  if(rs.ok!=null && (b.qtype==='speak'||b.qtype==='repeat')) h += `<details><summary>Pronunciación (autoevaluación)</summary><p><small>La plataforma solo recibe texto: no evalúa tu pronunciación. Escucha el modelo, grábate con tu dispositivo y marca:</small></p>${['Imité el ritmo y la entonación','Pronuncié claro los sonidos difíciles','Me entendería un hablante nativo'].map(x=>`<label class="opt"><input type="checkbox"> <span>${x}</span></label>`).join('')}</details>`;

function qHTML(b, ctx){
  QM[b.id]=ctx; if(!(b.id in Q)) Q[b.id]=initResp(b);
  const rs=RS[b.id], mostrar = rs && (ctx==='inline' || REV[b.id]), prev=P().respuestas[b.id];
  const boton = ctx==='inline' && !(rs?.pend) ? `<button class="pri" data-act="chk" data-q="${b.id}">${esAbierta(b)?'Enviar':'Comprobar'}</button>` : '';
  return `<div class="card q" id="q-${b.id}"><button class="flag ${P().errores[b.id]?'on':''}" data-act="flag" data-q="${b.id}" aria-label="Guardar esta pregunta para repasar" title="Guardar para repasar">${ico('flag',18)}</button><small>${esc(b.id)} · ${esc(b.attrs.skill||'')}${b.attrs.mode==='graded'?' · con nota':''}${prev?.ok&&!rs?' · <b class="ok">'+ico('check')+' lograda antes</b>':''}</small>${recursosQ(b)}${b.f.stem?`<p><b>${txt(b.f.stem)}</b></p>`:''}${cuerpoQ(b,Q[b.id])} <div class="row">${boton}</div>${mostrar?feedbackQ(b,rs):''}</div>`;
}
const refrescarQ = id => { const el=document.getElementById('q-'+id), b=curso.byId.get(id); if(el&&b) el.outerHTML = qHTML(b, QM[id]||'inline'); };

/* ---- Registro, conjuntos (evaluación de unidad / pruebas) ---- */
function registrar(b, ok, extra={}){
  const prev = P().respuestas[b.id];
  P().respuestas[b.id] = {ok, t:Date.now(), ...extra}; sumarXP(0);
  if(b.unit){ const m=(G().pas[hoy()] ||= {}), k=S.activo+':'+b.unit; m[k]=(m[k]||0)+0.25; }
  if(ok){ delete P().errores[b.id]; if(!prev?.ok) sumarXP(b.attrs.mode==='graded'?10:5); } else if(ok===false) P().errores[b.id]=1;
  guardarEstado(); actualizarConjuntos(); if(b.unit) actualizarPasos(b.unit);
}
async function enviarAbierta(id, forzado){
  const b=curso.byId.get(id), t=(Q[id]||'').trim(), min=minPal(b), pal=palabras(t);
  if(pal<min){
    if(!forzado){ RS[id]={ok:null, msg:`Escribe al menos ${min} palabras (llevas ${pal}).`}; return refrescarQ(id); }
    RS[id]={ok:false, msg:`Respuesta corta (${pal} de ${min} palabras).`}; registrar(b,false); return refrescarQ(id);
  }
  RS[id]={cargando:true}; refrescarQ(id);
  const j = await aiJudge(b,t);
  if(j){ RS[id]={ok:!!j.aprobado, c:j.comentario, fuertes:j.puntos_fuertes, mejorar:j.mejorar, banda:j.banda_aproximada}; registrar(b,RS[id].ok,{c:j.comentario}); }
  else RS[id]={pend:true, ok:null};
  refrescarQ(id); actualizarConjuntos();
}
async function comprobar(id){
  const b=curso.byId.get(id); if(esAbierta(b)) return enviarAbierta(id);
  const e=evalQ(b,Q[id]); RS[id]={ok:e.ok, msg:e.msg}; registrar(b,e.ok); sonido(e.ok?'ok':'mal'); refrescarQ(id);
}
async function terminarConjunto(key){
  const c=CONJ[key]; c.fin=true;
  c.qs.forEach(id=>{ const b=curso.byId.get(id); REV[id]=true; if(!esAbierta(b)){ const e=evalQ(b,Q[id]); RS[id]={ok:e.ok,msg:e.msg}; registrar(b,e.ok); } });
  c.qs.forEach(refrescarQ);
  for(const id of c.qs) if(esAbierta(curso.byId.get(id))){ await enviarAbierta(id,true); }
  actualizarConjuntos();
}
function calcConjunto(c){
  const qs=c.qs.map(id=>curso.byId.get(id)), cer=qs.filter(b=>!esAbierta(b)), ab=qs.filter(esAbierta);
  const okc=cer.filter(b=>RS[b.id]?.ok).length, pct=cer.length?Math.round(100*okc/cer.length):0, okA=ab.filter(b=>RS[b.id]?.ok===true).length, pend=ab.filter(b=>RS[b.id]?.ok==null).length;
  return {qs,cer,ab,okc,pct,okA,pend, pass: c.umbral!=null && pct>=c.umbral && okA===ab.length};
}
function cerrarConjunto(key, c, r){
  c.cerrado=true; const intento={t:Date.now(), pct:r.pct, ok:r.pass};
  if(c.tipo==='unidad'){
    const u = P().unidades[c.n] ||= {hist:[], mejor:0}; u.hist.push(intento); u.mejor=Math.max(u.mejor,r.pct);
    if(r.pass && !u.completa){ u.completa=true; sumarXP(50); celebrar('¡Unidad completada!'); }
  } else if(c.tipo==='prueba'){
    const x = P().pruebas[c.id] ||= {hist:[], mejor:0}; x.hist.push(intento); x.mejor=Math.max(x.mejor,r.pct);
    if(c.umbral!=null && r.pass && !x.ok){ x.ok=true; sumarXP(100); celebrar('¡Nivel superado!'); }
  }
  guardarEstado(); if(c.n) actualizarPasos(c.n);
}
function actualizarConjuntos(){
  for(const [key,c] of Object.entries(CONJ)){
    if(!c.fin) continue; const r=calcConjunto(c);
    if(!c.cerrado && r.pend===0) cerrarConjunto(key,c,r);
    const el=document.getElementById('res-'+key); if(el) el.innerHTML=resumenHTML(key,c,r);
  }
}
function resumenHTML(key, c, r){
  let h = `<div class="card"><h3 style="margin-top:0">Resultado: ${r.pct}% en preguntas cerradas (${r.okc} de ${r.cer.length})</h3>`;
  if(r.ab.length) h += `<p>Respuestas abiertas o habladas aprobadas: ${r.okA} de ${r.ab.length}${r.pend?` · <b>faltan ${r.pend} por evaluar</b>`:''}</p>`;
  if(c.tipo==='ubic'){
    const nv = nivelesDe(curso).filter(l=>l.cargado).map(l=>{ const q=r.cer.filter(b=>l.units.includes(b.unit)); return q.length?{l,p:Math.round(100*q.filter(b=>RS[b.id]?.ok).length/q.length)}:null; }).filter(Boolean);
    const rec = (nv.find(x=>x.p<60)||nv[nv.length-1])?.l;
    h += `<p>${nv.map(x=>`${x.l.id}: ${x.p}%`).join(' · ')}</p>${rec?`<p>Te recomendamos empezar en <b>${rec.id}</b>. Es una orientación, no un diagnóstico.</p><button class="pri" data-act="inicio" data-v="${rec.units[0]}">Empezar en ${rec.nombre||rec.id}</button>`:''}</div>`;
    return h;
  }
  if(r.pend===0){
    h += r.pass ? `<p class="tag ok" style="display:block;padding:8px">${ico('check')} Superaste el mínimo de ${c.umbral}% y las tareas abiertas.</p>`
      : `<p class="warn">Aún no llegas al mínimo (${c.umbral}% y todas las tareas abiertas aprobadas). Repasa y vuelve a intentarlo.</p>`;
    const malas = r.cer.filter(b=>!RS[b.id]?.ok), sk = {}; malas.forEach(b=>{ (sk[b.attrs.skill||'general'] ||= []).push(b.id); });
    if(!r.pass && malas.length) h += '<p><b>Qué repasar:</b></p><ul>'+Object.entries(sk).map(([k,v])=>`<li>${esc(k)}: ${v.map(esc).join(', ')}</li>`).join('')+'</ul>';
    h += (r.pass && c.tipo==='unidad' ? siguienteUnidadBtn(c.n) : '') + `<button data-act="reint" data-k="${esc(key)}">Intentar de nuevo</button>`;
  }
  if(c.tipo==='prueba') h += resultadoPrueba(c, r);
  return h+'</div>';
}
function resultadoPrueba(c, r){
  const sk={}; r.qs.forEach(b=>{ const k=b.attrs.skill||'general'; const o=sk[k] ||= {n:0,ok:0}; o.n++; if(RS[b.id]?.ok) o.ok++; });

  const doc = curso.docs.get(c.nivel);

  if(sec && r.pend===0){
    const enun = [...sec.items.map(i=>i.text||'').join('\n').matchAll(/^\s*(\d+)\.\s+(.*)$/gm)].map(m=>[+m[1],m[2]]);
    h += '<h3>Logros comprobados</h3>'+enun.map(([n,t])=>{ const qs=r.qs.filter(b=>+b.attrs.logro===n); const ok=qs.length&&qs.every(b=>RS[b.id]?.ok);
      return `<div class="${ok?'tag ok':qs.length?'warn':'tag'}" style="display:block;margin:4px 0;border-radius:10px;padding:6px 10px">${ok?ico('check'):qs.length?'Por mejorar':'Sin preguntas'} · ${inline(t)}</div>`; }).join('');
  }
  const tb = doc?.blocks.find(b=>b.type==='table' && /no lo lograste/i.test(b.attrs.caption||''));
  if(tb && !r.pass && r.pend===0) h += `<h3>Si no lo lograste</h3>`+renderTabla(tb.rows).replace(/(Unidad(?:es)?\s+)([\d\s,y–-]+)/g,(m,a,nums)=>a+nums.replace(/\d+/g,n=>`<a href="#/unidad/${n}">${n}</a>`));
  return h;
}
function reintentar(key){
  const c=CONJ[key]; c.qs.forEach(id=>{ delete Q[id]; delete RS[id]; delete REV[id]; delete P().respuestas[id]; });
  c.fin=false; c.cerrado=false; guardarEstado(); render();
}

/* ---- Desbloqueos y progreso ---- */
function pasoHecho(u, i){
  const qs = qsDe(u.sections[i].items);
  if(qs.length) return /^evaluacion/.test(normTit(u.sections[i].title)) ? !!P().unidades[u.n]?.completa : qs.every(b=>P().respuestas[b.id]);
  return !!P().pasos[u.n]?.[i];
}
function minSeg(s){ const w=s.items.reduce((a,i)=>a+palabras(i.t==='md'?i.text:(i.b.raw||'')),0); return Math.min(45, Math.max(5, Math.round(w*0.15))); }

/* ---- Pantallas ---- */
let SES = null;
let EXA = null;
function parseExam(b){
  const secs=[];

/* Una voz distinta por hablante, según acento y género; si el teléfono tiene pocas voces, se separa con el tono */

/* ---- Motor ---- */
function vozLimpiar(){ VOZ.gen++; clearInterval(VOZ.watch); clearTimeout(VOZ.pt); try{ if('speechSynthesis' in window) speechSynthesis.cancel(); }catch{} }

function vozCorrer(){ const gen=++VOZ.gen; setTimeout(()=>vozSig(gen), 90); }
function vozSig(gen){
  if(gen!==VOZ.gen) return;
  if(VOZ.i>=VOZ.segs.length){ const f=VOZ.fin; Object.assign(VOZ,{activa:false, pausada:false, key:null, frac:0, fin:null}); vozUI(); if(f) f(); return; }
  const s=VOZ.segs[VOZ.i], rate=VOZ.fijo ? VOZ.base : VOZ.base*velActual();
  VOZ.frac=VOZ.i/VOZ.segs.length; vozUI();
  if(s.pausa){ VOZ.pt=setTimeout(()=>{ if(gen!==VOZ.gen) return; VOZ.i++; vozSig(gen); }, s.pausa/rate); return; }
  let hecho=false;
  const fin=()=>{ if(hecho||gen!==VOZ.gen) return; hecho=true; clearInterval(VOZ.watch); VOZ.i++; setTimeout(()=>vozSig(gen),40); };
  const u=new SpeechSynthesisUtterance(s.text); u.lang=s.lang; if(s.voz) u.voice=s.voz; u.rate=Math.min(rate,4); u.pitch=s.pitch||1;
  u.onend=fin; u.onerror=ev=>{ if(ev && (ev.error==='interrupted'||ev.error==='canceled')) return; fin(); };
  speechSynthesis.speak(u);
  const t0=Date.now(), maxMs=(s.text.length/(12*rate)+3)*1800;   // vigilante: algunas voces no avisan al terminar
  VOZ.watch=setInterval(()=>{ if(gen!==VOZ.gen||hecho){ clearInterval(VOZ.watch); return; } const dt=Date.now()-t0;
    if(dt>1500 && !speechSynthesis.speaking && !speechSynthesis.pending) fin(); else if(dt>maxMs){ try{ speechSynthesis.cancel(); }catch{} fin(); } },400);
}
function vozIniciar(segs, key, base=1, fin=null, fijo=false){ vozParar(); Object.assign(VOZ,{segs, i:0, key, base, fijo, activa:true, pausada:false, frac:0, fin}); vozUI(); vozCorrer(); }
function extIniciar(src, key){
  vozParar(); const au=new Audio(src); au.playbackRate=velActual();
  au.ontimeupdate=()=>{ VOZ.frac=au.currentTime/(au.duration||1); vozUI(); };
  au.onended=()=>{ Object.assign(VOZ,{activa:false, pausada:false, key:null, ext:null, frac:0}); vozUI(); };
  Object.assign(VOZ,{ext:au, key, activa:true, pausada:false, frac:0, segs:[], i:0}); vozUI();
  au.play().catch(()=>{ toast('No se pudo reproducir el audio'); vozParar(); });
}
function vozPausar(){ if(!VOZ.activa) return; if(VOZ.ext) VOZ.ext.pause(); else vozLimpiar(); VOZ.activa=false; VOZ.pausada=true; vozUI(); }
function vozReanudar(){ if(!VOZ.pausada) return; VOZ.pausada=false; VOZ.activa=true; if(VOZ.ext){ VOZ.ext.playbackRate=velActual(); VOZ.ext.play(); vozUI(); } else { vozUI(); vozCorrer(); } }

function vozUI(){

  return `<h2 class="pg">Cursos</h2><p class="voz">${ids.length} curso${ids.length===1?'':'s'} · se guardan en este teléfono.</p>${ids.length?`<div class="lst">${ids.map(filaCurso).join('')}</div>`:'<div class="card mu">Aún no tienes cursos.</div>'}
  <div class="menu"><a href="#/perfil/contenido">${ico('plus')}<span class="grow">Añadir curso o contenido</span>${ico('right')}</a>${ids.length?`<a href="#/biblioteca">${ico('book')}<span class="grow">Biblioteca del curso activo</span>${ico('right')}</a>`:''}</div>`;
}

/* ---- Progreso: semana navegable, meta y desglose ---- */
let SEMOFF = 0;
const lunes = off => { const d=new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()-((d.getDay()+6)%7)+7*off); return d; };
const dstr = d => d.toISOString().slice(0,10);
const DLM = ['L','M','M','J','V','S','D'];
function vProgreso(){
  const g=G(), s=stats(), ini=lunes(SEMOFF), dias=Array.from({length:7},(_,i)=>{ const x=new Date(ini); x.setDate(ini.getDate()+i); return dstr(x); }), min=dias.map(d=>minutos(g.seg[d])), tot=min.reduce((a,b)=>a+b,0), meta=+S.ajustes.metaSem||0;
  const fin=new Date(ini); fin.setDate(ini.getDate()+6); const etq=SEMOFF===0?'Esta semana':SEMOFF===-1?'Semana pasada':`${ini.toLocaleDateString('es',{day:'numeric',month:'short'})} – ${fin.toLocaleDateString('es',{day:'numeric',month:'short'})}`, mx=Math.max(5,...min);
  const ses=g.ses.filter(x=>dias.includes(x.d)).slice(-8).reverse(), sk={}; let tr=0, ok=0;
  Object.keys(modelos).forEach(cid=>{ const m=modelos[cid]; Object.entries(PC(cid).respuestas).forEach(([id,r])=>{ tr++; if(r.ok) ok++; const k=m.byId.get(id)?.attrs.skill||'otra'; const o=sk[k] ||= {n:0,ok:0}; o.n++; if(r.ok) o.ok++; }); });
  const flojo=Object.entries(sk).filter(([,o])=>o.n>=5).map(([k,o])=>[k,o.ok/o.n]).sort((a,b)=>a[1]-b[1])[0], segT=Object.values(g.seg).reduce((a,b)=>a+b,0);
  return `<h2 class="pg">Progreso</h2><p class="voz">Todo se mide en este teléfono; no se envía a ningún servidor.</p>
  <div class="row sp nw"><button class="btn sm s" data-act="semp" aria-label="Semana anterior">${ico('left')}</button><b>${esc(etq)}</b><button class="btn sm s" data-act="semn" aria-label="Semana siguiente" ${SEMOFF>=0?'disabled':''}>${ico('right')}</button></div>
  <section class="card sum"><div class="grow"><div class="lb">Minutos de estudio</div><div class="n tn">${tot}<small>min</small></div><div class="mu tn">${meta?`${Math.min(100,Math.round(100*tot/meta))}% de la meta de ${hmin(meta)}`:'Sin meta semanal (se define en Ajustes)'}</div></div>${meta?anillo(Math.min(100,Math.round(100*tot/meta)),64):''}</section>
  <div class="card"><div class="wbars" role="img" aria-label="Minutos por día de la semana">${min.map((v,i)=>`<div><span class="tn">${v||''}</span><span class="trk"><i class="${v?'':'z'}" style="height:${v?Math.max(6,100*v/mx):3}%"></i></span><span>${DLM[i]}</span></div>`).join('')}</div></div>
  <div class="tiles"><div class="tile"><b>${s.dias}</b><small>días de práctica</small></div><div class="tile"><b>${tr?Math.round(100*ok/tr):0}%</b><small>acierto</small></div><div class="tile"><b>${Math.round(minutos(segT)/6)/10}</b><small>horas totales</small></div></div>
  ${ses.length?`<div class="sec">Sesiones de foco</div><div class="lst">${ses.map(x=>`<div class="li"><span class="grow">${esc(x.et)}<br><span class="mu tn">${esc(new Date(x.d+'T12:00:00').toLocaleDateString('es',{weekday:'short',day:'numeric'}))}</span></span><b class="tn">${hmin(x.min)}</b></div>`).join('')}</div>`:''}
  <div class="sec">Actividad · 12 semanas</div><div class="card">${heat12()}<div class="row sp mu mt"><span>menos</span><span>más</span></div></div>
  <div class="sec">Acierto por habilidad</div><div class="card">${Object.entries(sk).map(([k,o])=>`<div class="cb"><span class="nm">${esc(k)}</span><div class="bar"><i style="width:${100*o.ok/o.n}%"></i></div><span class="v tn">${Math.round(100*o.ok/o.n)}%</span></div>`).join('')||'<span class="mu">Aún sin respuestas.</span>'}</div>
  ${flojo?`<div class="al"><b>Para reforzar:</b> ${esc(flojo[0])} (<span class="tn">${Math.round(flojo[1]*100)}%</span> de acierto)</div>`:''}
  <div class="sec">Por curso</div><div class="lst">${Object.keys(modelos).map(filaCurso).join('')}</div>`;
}

/* ============ 8. ENRUTADO Y EVENTOS ============ */
let NOVOZ = false;
/* ---- Enrutado ---- */
function render(){
  try{ renderInterno(); }
  catch(e){ console.error(e); $('#v').innerHTML = `<h1>Algo salió mal</h1><div class="card"><p>No se pudo mostrar esta pantalla. Tu avance está a salvo.</p><p class="mut"><small>${esc(e.message)}</small></p><button class="pri" onclick="location.hash='#/inicio';location.reload()">Volver al inicio</button></div>`; }
}
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) vozPausar(); else if(S.timer) wake(true); });
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ cerrarConf(false); return; }
  if(/input|textarea|select/i.test(e.target.tagName||'') || e.ctrlKey || e.metaKey) return;
  const m=/^#\/unidad\/(\d+)/.exec(location.hash); if(!m || PASO[m[1]]===undefined) return; const u=curso.units.get(+m[1]), i=PASO[m[1]]+(e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0);
  if(u && i!==PASO[m[1]] && i>=0 && i<u.sections.length){ PASO[m[1]]=i; pintarPaso(m[1]); window.scrollTo(0,0); }
});
window.addEventListener('error', e=>toast('Algo falló: '+(e.message||'error')));
window.addEventListener('unhandledrejection', e=>toast('Algo falló: '+(e.reason?.message||'error')));
function tic(){
  if(!EXA||EXA.fase!=='run') return; const r=Math.max(0,Math.round((EXA.fin-Date.now())/1000)), c=document.getElementById('cron');
  if(c) c.textContent=`${Math.floor(r/60)}:${pad2(r%60)}`; if(r<=0) terminarPrueba();
}
async function exportar(){
  const blob=new Blob([JSON.stringify({app:'academia-ingles-v1', packs:[...packs.values()].filter(p=>!p.embebido), estado:S, media:Object.entries(MEDIA)})],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='academia-respaldo-'+hoy()+'.json'; a.click(); S.respaldo=new Date().toISOString(); guardarEstado(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
async function importar(f){
  try{ const d=JSON.parse(await f.text()); if(d.app!=='academia-ingles-v1') throw 0;
    for(const p of d.packs) await guardarPack(p); for(const [id,data] of d.media||[]){ MEDIA[id]=data; if(_db) await idb('media','readwrite',s=>s.put({id, data})); } S=Object.assign(estadoInicial(),d.estado); normalizar(); guardarEstado(); aplicarAjustes(); await recargarCurso(); toast('Copia restaurada'); render();
  }catch{ toast('Ese archivo no es una copia válida'); }
}
function setResp(el){
  const id=el.dataset.q, k=el.dataset.r; if(!id||!k) return;
  if(k==='v') Q[id]=el.value; else if(k==='m'){ const s=new Set(Q[id]); el.checked?s.add(el.value):s.delete(el.value); Q[id]=[...s]; }
  else if(k==='k') Q[id]={...Q[id],[el.dataset.k]:el.value}; else if(k==='i'){ const a=[...Q[id]]; a[+el.dataset.i]=el.value; Q[id]=a; }
  const c=document.getElementById('cnt-'+id); if(c) c.textContent=palabras(Q[id])+' palabras';
}
function ajuste(el){
  const p=el.dataset.aj, v = el.type==='checkbox' ? el.checked : (p==='fuente'||p==='umbral'||p==='vel'||p==='metaSem') ? +el.value : el.value;
  if(p.startsWith('ia.')) S.ajustes.ia[p.slice(3)]=v; else S.ajustes[p]=v; guardarEstado(); aplicarAjustes();
}
document.addEventListener('input', e=>{ setResp(e.target); if(e.target.dataset.nd){ G().notas[hoy()]=e.target.value; clearTimeout(window.__nd); window.__nd=setTimeout(guardarEstado,600); } if(e.target.dataset.nota){ P().notas[e.target.dataset.nota]=e.target.value; clearTimeout(window.__nt); window.__nt=setTimeout(guardarEstado,600); } if(e.target.id==='destnom' && pendientes) pendientes.nuevo=e.target.value; });
document.addEventListener('change', e=>{ setResp(e.target); if(e.target.id==='dest' && pendientes){ pendientes.dest=e.target.value; $('#prev').innerHTML=vPrevia(); } if(e.target.dataset.aj) ajuste(e.target); if(e.target.dataset.pers){ ((S.cursosInfo[S.activo] ||= {}).pers ||= {})[e.target.dataset.pers]=e.target.value.trim(); guardarEstado(); render(); } if(e.target.id==='imp' && e.target.files[0]) importar(e.target.files[0]); if(e.target.id==='med' && e.target.files.length) subirMedia([...e.target.files]); });
document.addEventListener('click', e=>{
  if(e.target.id==='ov'){ cerrarConf(false); return; }
  const el=e.target.closest('[data-act]'); if(!el) return; const id=el.dataset.q;
  switch(el.dataset.act){
    case 'chk': comprobar(id); break;
    case 'tf': Q[id]=el.dataset.v; refrescarQ(id); break;
    case 'mic': dictar(id, el); break;
    case 'say': decir(el.dataset.t); break;
    case 'sayq': { const b=curso.byId.get(id), ext=audSrc(b.attrs.audio); if(ext) new Audio(ext).play(); else decir(b.f.target.replace(/^["“]|["”]$/g,'')); break; }
    case 'auto': { const b=curso.byId.get(id), ok=el.dataset.v==='1'; RS[id]={ok, auto:true}; registrar(b,ok,{auto:true}); refrescarQ(id); break; }
    case 'au': reproducir(el); break;
    case 'auri': PL[el.dataset.key]=0; vozUI(); break;
    case 'vel': vozVel(); break;
    case 'cl': P().checks[el.dataset.k]=el.checked; guardarEstado(); break;
    case 'ir': { const n=el.dataset.n; PASO[n]=+el.dataset.i; pintarPaso(n); window.scrollTo(0,0); break; }
    case 'sig': { const n=el.dataset.n, i=+el.dataset.i, falta=Math.ceil(+el.dataset.s-(Date.now()-(ABIERTO[n+':'+i]||Date.now()))/1000);
      if(falta>0){ toast(`Lee un poco más: faltan ${falta} s`); break; }
      (P().pasos[n] ||= [])[i]=true; sumarXP(2); { const m=(G().pas[hoy()] ||= {}), k=S.activo+':'+n; m[k]=(m[k]||0)+1; } guardarEstado(); const u=curso.units.get(+n);
      if(i+1<u.sections.length){ PASO[n]=i+1; pintarPaso(n); window.scrollTo(0,0); } else location.hash='#/ruta'; break; }
    case 'ob': { const r=Q[id], k=r.b.findIndex(t=>t.i===+el.dataset.i); if(k>=0){ r.a.push(r.b.splice(k,1)[0]); refrescarQ(id); } break; }
    case 'oa': { const r=Q[id], t=r.a.splice(+el.dataset.k,1)[0]; if(t){ r.b.push(t); r.b.sort((x,y)=>x.i-y.i); refrescarQ(id); } break; }
    case 'hl': { const sel=getSelection(), box=el.closest('.card,details')?.querySelector('.ptxt');
      if(!sel||sel.isCollapsed||!box||!box.contains(sel.anchorNode)){ toast('Selecciona primero un texto de la lectura'); break; }
      try{ const m=document.createElement('mark'); sel.getRangeAt(0).surroundContents(m); }catch{ toast('Selecciona dentro de un mismo párrafo'); } sel.removeAllRanges(); break; }
    case 'hlx': el.closest('.card,details')?.querySelector('.ptxt')?.querySelectorAll('mark').forEach(m=>m.replaceWith(...m.childNodes)); break;
    case 'pim': promptsImagenes(); break;
    case 'flag': { const e=P().errores; if(e[id]) delete e[id]; else e[id]=1; guardarEstado(); refrescarQ(id); break; }
    case 'flash': SES={tipo:'flash', c:mezclar(mazo(),hoy()+'f').slice(0,20), i:0, ok:0, volteada:false}; pintarSesion(); break;
    case 'flip': SES.volteada=true; pintarSesion(); break;
    case 'fk': case 'fn': calificarCarta(SES.v, el.dataset.act==='fk'); SES.i++; SES.volteada=false; pintarSesion(); break;
    case 'cert': certificado(el.dataset.l); break;
    case 'rest': confirmarSheet('Restaurar copia','Reemplaza tu avance actual.','Restaurar',false).then(ok=>{ if(ok) restaurarAuto(el.dataset.id); }); break;
    case 'cf1': cerrarConf(true); break;
    case 'cf0': cerrarConf(false); break;
    case 'upd': location.reload(); break;
    case 'cico': ((S.cursosInfo[S.activo] ||= {}).pers ||= {}).icono=el.dataset.n; guardarEstado(); render(); break;
    case 'foco': sheetFoco(); break;
    case 'fgo': cerrarSheet(); iniciarFoco({cid:S.activo||Object.keys(modelos)[0], etiqueta:'Estudio libre', min:+el.dataset.m}); break;
    case 'pini': { const i=planHoy()[+el.dataset.i]; if(i) iniciarFoco({cid:i.cid, n:i.n, etiqueta:i.t, min:i.min, ir:i.ir}); break; }
    case 'pabr': { const i=planHoy()[+el.dataset.i]; if(i) location.hash=i.ir; break; }
    case 'tpau': pausarFoco(); break;
    case 'tres': reanudarFoco(); break;
    case 'tmas': if(S.timer){ S.timer.obj+=300; S.timer.avisado=false; guardarEstado(); tickFoco(); } break;
    case 'tenf': FOCO=!FOCO; render(); break;
    case 'tfin': terminarFoco(); break;
    case 'tfoco': location.hash='#/inicio'; break;
    case 'semp': SEMOFF--; render(); break;
    case 'semn': if(SEMOFF<0){ SEMOFF++; render(); } break;
    case 'fin': terminarConjunto(el.dataset.k); break;
    case 'reint': reintentar(el.dataset.k); break;
    case 'ses': SES={c:mezclar(vencidas(),hoy()).slice(0,10),i:0,ok:0}; pintarSesion(); break;
    case 'rv': responderRepaso(el.dataset.v); break;
    case 'rvn': SES.i++; pintarSesion(); break;
    case 'exgo': EXA.fase='run'; EXA.fin=Date.now()+EXA.min*60000; EXA.t=setInterval(tic,1000); pintarPrueba(); tic(); break;
    case 'exnext': if(EXA.i+1<EXA.secs.length){ EXA.i++; pintarPrueba(); window.scrollTo(0,0); } else terminarPrueba(); break;
    case 'inicio': P().inicio=+el.dataset.v; guardarEstado(); toast('Listo: tu ruta empieza ahí'); break;
    case 'exp': exportar(); break;
    case 'inst': if(DEFER){ DEFER.prompt(); DEFER=null; } break;
    case 'min1': { const v=vencidas(), base=v.length?v:mazo();
      if(base.length){ SES={c:mezclar(base,hoy()).slice(0,1),i:0,ok:0}; location.hash='#/repaso'; }
      else { const id=Object.keys(modelos).find(c=>avance(c).sig); if(id) location.hash=`#/curso/${id}/unidad/${avance(id).sig}`; else toast('Aún no hay nada por hacer'); } break; }
  }
});

function enlazarImportador(){
  const dz=$('#drop'), inp=$('#files');
  inp.addEventListener('change', e=>leerArchivos([...e.target.files]));
  ['dragover','dragenter'].forEach(ev=>dz.addEventListener(ev,e=>{ e.preventDefault(); dz.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{ e.preventDefault(); dz.classList.remove('over'); }));
  dz.addEventListener('drop', e=>leerArchivos([...e.dataTransfer.files]));
  dz.querySelector('label').addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); inp.click(); } });
}
document.addEventListener('click', async e=>{
  const el = e.target.closest('[data-act]'); if(!el) return; const act = el.dataset.act;
  if(act==='meta'){ (S.cursos[S.activo] ||= {}).meta=el.dataset.v; guardarEstado(); render(); }
  if(act==='cancelar'){ pendientes=null; render(); }
  if(act==='confirmar'){
    const nom = ($('#destnom')?.value||pendientes.nuevo||'').trim(); pendientes.nuevo = nom;
    const antes = new Set(Object.keys(modelos)), tocados = new Set();
    for(const p of pendientes.packs){ const cid=destinoFinal(p); tocados.add(cid); if(!antes.has(cid) && nom && !p.declCurso) (S.cursosInfo[cid] ||= {}).nombre = nom; await guardarPack(asignar({...p}, cid)); }
    const n = pendientes.packs.length, nuevo = [...tocados].find(c=>!antes.has(c)); pendientes=null; await recargarCurso();
    toast(n+' paquete(s) guardados'); if(nuevo){ activar(nuevo); location.hash='#/curso/'+nuevo; } else render();
  }
  if(act==='borrar' && await confirmarSheet('Quitar paquete','Tu progreso se conserva.','Quitar')){ await borrarPack(el.dataset.k); await recargarCurso(); render(); }
  if(act==='borrarcurso' && await confirmarSheet('Eliminar curso','Se borran sus paquetes y su progreso. No se puede deshacer.','Eliminar')){
    const c=el.dataset.c; for(const q of [...packs.values()].filter(q=>q.curso===c)) await borrarPack(q.key);
    delete S.cursos[c]; delete S.cursosInfo[c]; if(S.activo===c) S.activo=''; await recargarCurso(); render(); }
});
window.addEventListener('hashchange', render);

/* ============ 9. APP INSTALABLE (PWA) ============ */
let DEFER = null, PERSIST = null;
const estadoApp = () => (matchMedia('(display-mode: standalone)').matches || navigator.standalone ? 'Abierta como app. ' : 'Aún no instalada. ')
  + (PERSIST ? 'Almacenamiento protegido.' : 'Almacenamiento NO protegido: la app funciona igual, pero exporta tu copia cada semana.');
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); DEFER = e; if(location.hash==='#/perfil') render(); });
if(navigator.storage?.persist) navigator.storage.persist().then(v=>{ PERSIST=v; const e=$('#pst'); if(e) e.textContent=estadoApp(); }).catch(()=>{});
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').then(reg=>{ reg.onupdatefound=()=>{ const w=reg.installing; if(w) w.onstatechange=()=>{ if(w.state==='installed' && navigator.serviceWorker.controller){ const u=$('#upd'); if(u) u.hidden=false; } }; }; }).catch(()=>{});

/* ============ 10. ARRANQUE ============ */
(async function(){
  aplicarAjustes();
  _db = await abrirDB();
  if(!_db) toast('Este navegador no permite guardar el curso; el contenido durará solo esta sesión');
  await cargarMedia(); await recargarCurso(); revisarInsignias(true); montarShell(); iniciarTiempo(); render(); autocopia();
})();
</script>
