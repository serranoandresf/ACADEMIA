<style>
:root{--bg:#f5f5f7;--card:#fff;--ink:#1d1d1f;--mut:#6e6e73;--line:#e3e3e8;--acc:#0b5fd6;--ok:#1b7f45;--okbg:#e6f4ec;--mej:#b45a00;--mejbg:#fdf0e1;--r:16px}
:root[data-theme=dark]{--bg:#111114;--card:#1c1c20;--ink:#f5f5f7;--mut:#a1a1a8;--line:#2c2c31;--acc:#6aa8ff;--ok:#5fd08b;--okbg:#12301f;--mej:#f0a24a;--mejbg:#35240f}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111114;--card:#1c1c20;--ink:#f5f5f7;--mut:#a1a1a8;--line:#2c2c31;--acc:#6aa8ff;--ok:#5fd08b;--okbg:#12301f;--mej:#f0a24a;--mejbg:#35240f}}
*{box-sizing:border-box}
html{font-size:100%;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;padding-top:env(safe-area-inset-top)}

h1{font-size:1.6rem;margin:.2em 0 .4em;line-height:1.2}h2{font-size:1.2rem;margin:1.2em 0 .4em}h3{font-size:1.05rem;margin:1em 0 .3em}
p{margin:.5em 0}a{color:var(--acc)}small,.mut{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:0}
button,.btn{font:inherit;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
button.pri,.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.chip{min-height:44px;border-radius:999px}button.on{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
select,input[type=text],input[type=search]{font:inherit;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 12px;width:100%}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs a{flex:1;min-height:56px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--mut);font-size:.9rem}
nav.tabs a[aria-current=page]{color:var(--acc);font-weight:600}

.tag.ok{background:var(--okbg);color:var(--ok)}.tag.mej{background:var(--mejbg);color:var(--mej)}

.tw{overflow-x:auto;margin:10px 0}table{border-collapse:collapse;min-width:100%}th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}th{background:var(--bg)}
details{border-top:1px solid var(--line);padding:8px 0}summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600}

.blk{border-left:4px solid var(--line);padding:4px 12px;margin:10px 0}.blk.tip{border-color:var(--ok)}.blk.warning,.blk.exam{border-color:var(--mej)}
.opt{display:flex;gap:10px;align-items:flex-start;min-height:44px;padding:6px 0}.opt input{width:22px;height:22px;margin-top:2px}.proc{display:flex;flex-wrap:wrap;gap:8px;padding-left:20px}.au{border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}figure{margin:10px 0}textarea{width:100%}label select,label input[type=text]{margin:4px 0 10px}
.dots{display:flex;gap:6px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}.dots i.on{background:var(--ok);border-color:var(--ok)}.dots i.hoy{outline:2px solid var(--acc);outline-offset:2px}
.conf{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}.conf span{position:absolute;top:-30px;font-size:1.6rem;animation:cae 1.8s ease-in forwards}@keyframes cae{to{transform:translateY(105vh) rotate(360deg);opacity:.9}}
.curso{display:block;text-decoration:none;color:inherit}.urow{display:flex;gap:10px;align-items:center;min-height:44px;padding:6px 4px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}.urow.lock{opacity:.55}.urow.ok b{color:var(--ok)}

<body>
<main id="app" aria-live="polite"></main>
<nav class="tabs" aria-label="Principal">
<a href="#/inicio" data-tab="inicio">Inicio</a><a href="#/repaso" data-tab="repaso">Repaso</a><a href="#/biblioteca" data-tab="biblioteca">Biblioteca</a><a href="#/buscar" data-tab="buscar">Buscar</a><a href="#/perfil" data-tab="perfil">Perfil</a>
</nav>
<script>
'use strict';
/* ============ 1. CONFIGURACIÓN ============ */
const DB_NAME = 'academia-ingles-v1', LS_KEY = 'academia-ingles-v1:estado';
/* Modo embebido (opcional): build.py coloca aquí uno o varios .md. Lo importado gana en conflictos. */
const COURSE_MD = ``;
const METAS = {academic:'IELTS Academic', general:'IELTS General', toefl:'TOEFL iBT'};
const PASOS = ['Objetivos','Repaso rápido','Vocabulario','Gramática','Texto o diálogo modelo','Cuidado','Módulo de examen','Ejercicios','Hablar y escribir','Lista de verificación','Tarea de aplicación','Evaluación de la unidad'];
const Q_TIPOS = ['mcq','mcq-multi','tfng','ynng','fill','fillbank','match','short','order','label','repeat','open','speak','write'];
const Q_ABIERTAS = ['open','speak','write'];
const BLOQUES = ['box','vocab','pron','table','passage','audio','image','chart','process','q','checklist','model-answer','exam'];

/* ============ 2. UTILIDADES ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
const pad2 = n => String(n).padStart(2,'0');
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3200); }

/* ---- Markdown mínimo y seguro (todo se escapa antes) ---- */
function inline(t){
  let s = esc(t);
  s = s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g,'$1<i>$2</i>');
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  return s.replace(/VERIFICAR/g,'<a class="verif" href="#/nota-verificar">VERIFICAR<small> en el sitio oficial</small></a>');
}
function md(text){
  const L = String(text).split('\n'); let out = '', i = 0;
  while(i < L.length){
    const l = L[i];
    if(!l.trim()){ i++; continue; }
    if(/^\s*\|/.test(l)){ const r=[]; while(i<L.length && /^\s*\|/.test(L[i])) r.push(L[i++]); out += renderTabla(parseTabla(r)); continue; }
    let m;
    if((m=/^(#{2,6})\s+(.*)$/.exec(l))){ out += `<h3>${inline(m[2])}</h3>`; i++; continue; }
    if(/^\s*[-*]\s+/.test(l)){ out+='<ul>'; while(i<L.length && /^\s*[-*]\s+/.test(L[i])) out+=`<li>${inline(L[i++].replace(/^\s*[-*]\s+/,''))}</li>`; out+='</ul>'; continue; }
    if(/^\s*\d+[.)]\s+/.test(l)){ out+='<ol>'; while(i<L.length && /^\s*\d+[.)]\s+/.test(L[i])) out+=`<li>${inline(L[i++].replace(/^\s*\d+[.)]\s+/,''))}</li>`; out+='</ol>'; continue; }
    const p=[]; while(i<L.length && L[i].trim() && !/^\s*(\||[-*]\s|\d+[.)]\s|#)/.test(L[i])) p.push(L[i++]);
    if(!p.length){ p.push(L[i++]); }
    out += `<p>${inline(p.join(' '))}</p>`;
  }
  return out;
}

/* ============ 3. PARSER (Formato Academia) ============ */
/*PARSER-START*/
/* Atributos clave=valor con o sin comillas (rectas o tipográficas) */
function parseAttrs(s){
  const a = {}, re = /([\w-]+)\s*=\s*(?:"([^"]*)"|“([^”]*)”|'([^']*)'|([^\s"“']+))/g; let m;
  while((m = re.exec(s||''))) a[m[1].toLowerCase()] = m[2] ?? m[3] ?? m[4] ?? m[5] ?? '';
  return a;
}
function parseMetaLine(s){ const o={}; String(s).split('|').forEach(p=>{ const m=/^\s*([\w-]+)\s*=\s*(.*?)\s*$/.exec(p); if(m) o[m[1].toLowerCase()]=m[2]; }); return o; }

/* Tabla Markdown con {colspan=n}/{rowspan=n} al inicio de la celda */
function parseTabla(rows){
  const out = [];
  rows.forEach(r=>{
    if(/^\s*\|?[\s:|-]+\|?\s*$/.test(r) && /-/.test(r)) return;
    const cells = r.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>{
      c = c.trim(); let cs=1, rs=1;
      const m = /^\{([^}]*)\}\s*/.exec(c);
      if(m){ const a=parseAttrs(m[1]); cs=+a.colspan||1; rs=+a.rowspan||1; c=c.slice(m[0].length); }
      return {t:c, cs, rs};
    });
    out.push(cells);
  });
  return out;
}
function renderTabla(rows){
  if(!rows.length) return '';
  const row = (r,h) => '<tr>'+r.map(c=>`<${h?'th':'td'}${c.cs>1?` colspan="${c.cs}"`:''}${c.rs>1?` rowspan="${c.rs}"`:''}>${inline(c.t)}</${h?'th':'td'}>`).join('')+'</tr>';
  return `<div class="tw"><table><thead>${row(rows[0],true)}</thead><tbody>${rows.slice(1).map(r=>row(r,false)).join('')}</tbody></table></div>`;
}

const CAMPOS = {
  q: ['stem','options','answer','accept','limit','bank','pairs','items','target','turns','rubric','key_ideas','min_words','time_sec','sample','explain'],
  pron: ['tip','pares'], audio: ['speakers'], image: ['prompt','uso'], chart: ['labels','series']
};
/* Lee campos "nombre: valor" con líneas de continuación; "series" puede repetirse */
function parseCampos(tipo, body){
  const set = CAMPOS[tipo], re = new RegExp('^\\s*('+set.join('|')+')\\s*:\\s*(.*)$','i');
  const f = {}; let cur = null; const extra = [];
  body.forEach(l=>{
    const m = re.exec(l);
    if(m){ cur = m[1].toLowerCase(); if(cur==='series'){ (f.series ||= []).push(m[2]); } else f[cur] = m[2]; }
    else if(cur && cur!=='series' && l.trim()) f[cur] += '\n'+l.trim();
    else if(l.trim()) extra.push(l);
  });
  return {f, extra};
}
const lista = s => String(s||'').split(/[,;\n]/).map(x=>x.trim()).filter(Boolean);

function parseBloque(tipo, attrs, body){
  const b = {type:tipo, attrs, id:attrs.id||null, raw:body.join('\n')};
  if(tipo==='q'){
    const {f} = parseCampos('q', body);
    b.qtype = (attrs.type||'').toLowerCase(); b.f = f;
    b.options = []; const re=/(?:^|\n)\s*[-*]?\s*\(?([a-hA-H])[).]\s+(.*)/g; let m;
    while((m=re.exec(f.options||''))) b.options.push({k:m[1].toLowerCase(), t:m[2].trim()});
    b.accept = lista(f.accept);
    const mw = /\d+/.exec(f.min_words||''); b.minWords = mw ? +mw[0] : null;
    const ts = /time_sec\s*[:=]?\s*(\d+)/i.exec((f.min_words||'')+' '+(f.time_sec||'')) || /^\s*(\d+)/.exec(f.time_sec||'');
    b.timeSec = ts ? +ts[1] : null;
  } else if(tipo==='audio'){
    const {f} = parseCampos('audio', body); b.speakers = f.speakers||''; b.turns = [];
    body.forEach(l=>{ const m=/^\s*([A-Za-z]):\s*(.*)$/.exec(l); if(m) b.turns.push({who:m[1].toUpperCase(), text:m[2]}); });
  } else if(tipo==='pron'){
    const {f} = parseCampos('pron', body); b.tip=f.tip||''; b.pares=lista(f.pares).map(p=>p.split(/\s*[-–]\s*/));
  } else if(tipo==='image'){ b.f = parseCampos('image', body).f;
  } else if(tipo==='chart'){
    const {f} = parseCampos('chart', body); b.labels = lista(f.labels);
    b.series = (f.series||[]).map(s=>{ const m=/^\s*(.*?)\s*=\s*(.*)$/.exec(s); return m ? {name:m[1], vals:lista(m[2]).map(Number)} : {name:'', vals:lista(s).map(Number)}; });
  } else if(tipo==='vocab'){
    b.rows = body.filter(l=>l.trim() && l.includes('|')).map(l=>{ const c=l.split('|').map(x=>x.trim()); return {term:c[0],ipa:c[1]||'',es:c[2]||'',ex:c[3]||'',col:c[4]||''}; });
  } else if(tipo==='table'){ b.rows = parseTabla(body.filter(l=>/^\s*\|/.test(l)));
  } else if(tipo==='process'){ b.steps = body.filter(l=>/^\s*\d+[.)]/.test(l)).map(l=>l.replace(/^\s*\d+[.)]\s*/,''));
  } else if(tipo==='checklist'){ b.items = body.filter(l=>l.trim()).map(l=>l.replace(/^\s*[-*]\s*(\[[ xX]\]\s*)?/,'').trim());
  } else if(tipo==='exam'){ b.refs = (b.raw.match(/\b[A-Z]{1,3}\d*-[A-Z0-9]+-?[A-Z]*\d+\b/g)||[]).filter(x=>x!==b.id);
  } else if(tipo==='passage'){ b.text = body.join('\n').trim(); }
  else b.text = body.join('\n').trim();
  return b;
}

/* Divide un archivo en paquetes: documento, portada o unidades sueltas */
function dividirPaquetes(texto){
  const L = texto.replace(/\r/g,'').split('\n'); let dentro=false; const heads=[];
  L.forEach((l,i)=>{
    if(dentro){ if(/^\s*:::\s*$/.test(l)) dentro=false; return; }
    if(/^\s*:::\s*[A-Za-z]/.test(l)){ dentro=true; return; }
    const m=/^#\s+(?!#)(.+)$/.exec(l); if(!m) return; const t=m[1].trim();
    const k = /^DOCUMENTO\s+[ABC][12]\b/i.test(t)?'doc' : /^PORTADA/i.test(t)?'portada' : /^Unidad\s+\d+/i.test(t)?'unit' : null;
    if(k) heads.push({i,k,t});
  });
  if(!heads.length) return {error:'No se reconoció ningún encabezado (# DOCUMENTO …, # PORTADA …, # Unidad N).', packs:[]};
  const segs=[]; let cur=null;
  heads.forEach(h=>{ if(h.k==='unit' && cur && cur.k==='doc') return; cur={...h}; segs.push(cur); });
  const packs = segs.map((s,j)=>{
    const fin = j+1<segs.length ? segs[j+1].i : L.length, md = L.slice(s.i,fin).join('\n');
    if(s.k==='doc'){ const id=/([ABC][12])/i.exec(s.t)[1].toUpperCase(), pt=+(/parte\s*(\d+)/i.exec(s.t)||[])[1]||1; return {key:'DOC:'+id+(pt>1?'#'+pt:''), kind:'doc', id, parte:pt, md}; }
    if(s.k==='portada') return {key:'PORTADA', kind:'portada', id:'PORTADA', md};
    const n=+/Unidad\s+(\d+)/i.exec(s.t)[1]; return {key:'UNIT:'+pad2(n), kind:'unit', id:n, md};
  });
  return {packs};
}

/* Analiza un paquete → estructura de documento/unidades/secciones/bloques */
function parsePaquete(pack){
  const L = pack.md.replace(/\r/g,'').split('\n');
  const r = {key:pack.key, kind:pack.kind, id:pack.id, meta:{}, units:[], docSections:[], blocks:[], warn:[]};
  let unit=null, sec=null, buf=[];
  const flush = () => { const t=buf.join('\n').trim(); if(t && sec) sec.items.push({t:'md', text:t}); buf=[]; };
  const nueva = (title, doc) => { flush(); sec={title, doc, items:[]}; (doc||!unit ? r.docSections : unit.sections).push(sec); };
  for(let i=0; i<L.length; i++){
    const l = L[i]; let m;
    if((m=/^\s*:::\s*([A-Za-z][\w-]*)\s*(.*)$/.exec(l))){
      const tipo = m[1].toLowerCase(), attrs = parseAttrs(m[2]), body=[]; i++;
      while(i<L.length && !/^\s*:::\s*$/.test(L[i])) body.push(L[i++]);
      if(i>=L.length) r.warn.push(`Bloque :::${tipo}${attrs.id?' '+attrs.id:''} sin cierre ":::" al final del archivo`);
      if(!sec){ flush(); sec={title:'(inicio)',doc:!unit,items:[]}; (unit?unit.sections:r.docSections).push(sec); }
      flush();
      const b = parseBloque(tipo, attrs, body); b.unit = sec.doc ? null : unit?.n ?? null;
      if(!BLOQUES.includes(tipo)) r.warn.push(`Bloque desconocido :::${tipo}${attrs.id?' ('+attrs.id+')':''}; se muestra de forma genérica`);
      sec.items.push({t:'block', b}); r.blocks.push(b); continue;
    }
    if(/^#\s+(?!#)/.test(l)){
      flush();
      if((m=/^#\s+Unidad\s+(\d+)\.?\s*(.*)$/i.exec(l))){ unit={n:+m[1], title:m[2].trim(), meta:{}, sections:[]}; r.units.push(unit); sec=null; }
      else if(/^#\s+(DOCUMENTO|PORTADA)/i.test(l)){ r.title=l.replace(/^#\s+/,'').trim(); sec=null; }
      else { unit=null; nueva(l.replace(/^#\s+/,'').trim(), true); }
      continue;
    }
    if((m=/^##\s+(.*)$/.exec(l))){ const t=m[1].trim(); nueva(t, !unit || /prueba de logro|glosario/i.test(t)); continue; }
    if(!sec && (m=/^meta:\s*(.*)$/i.exec(l))){ (unit ? unit.meta : r.meta) && Object.assign(unit ? unit.meta : r.meta, parseMetaLine(m[1])); continue; }
    if(/^\s*FIN DEL CURSO\s*$/i.test(l)) continue;
    if(!sec && !l.trim()) continue;
    if(!sec){ sec={title:'(inicio)',doc:!unit,items:[]}; (unit?unit.sections:r.docSections).push(sec); }
    buf.push(l);
  }
  flush();
  return r;
}
/*PARSER-END*/

/* ============ 4. MODELO DEL CURSO + VALIDACIÓN ============ */
/* Un documento puede llegar en partes ("# DOCUMENTO A1 · parte 2/3"): se unen en orden antes de analizarlo */
function unirPartes(packsMap){
  const out = new Map(), partes = [], av = [];
  packsMap.forEach(p=>{ if(p.kind==='doc' && (p.parte||1)>1) partes.push(p); else out.set(p.key, {...p}); });
  partes.sort((a,b)=>a.parte-b.parte).forEach(p=>{
    const base = out.get('DOC:'+p.id), cuerpo = p.md.split('\n').slice(1).join('\n');
    if(base) base.md += '\n'+cuerpo; else { out.set('DOC:'+p.id, {...p, key:'DOC:'+p.id}); av.push({where:'Documento '+p.id, msg:`Falta la parte 1 (la que trae "# DOCUMENTO ${p.id}" y la guía de uso)`}); }
  });
  return {out, av};
}
function construirCurso(packsMap){
  const c = {parsed:[], units:new Map(), docs:new Map(), portada:null, byId:new Map(), dup:[], warn:[]};
  const orden = {doc:0, portada:1, unit:2};
  const um = unirPartes(packsMap); um.av.forEach(x=>c.warn.push(x));
  [...um.out.values()].sort((a,b)=>orden[a.kind]-orden[b.kind] || String(a.key).localeCompare(b.key)).forEach(p=>{
    const r = parsePaquete(p); c.parsed.push(r);
    if(p.kind==='portada') c.portada = r;
    if(p.kind==='doc') c.docs.set(p.id, r);
    r.units.forEach(u=>{
      if(c.units.has(u.n)) c.warn.push({where:'Unidad '+u.n, msg:`Aparece dos veces (${c.units.get(u.n).from} y ${p.key}); se usa ${p.key}`});

    else svg += c.series.map((s,k)=>s.vals.map((v,i)=>{ const w=bw*.8/ns, h=(H-2*p)*v/max; return `<rect x="${p+bw*i+bw*.1+w*k}" y="${H-p-h}" width="${w}" height="${h}" fill="${COL[k%4]}"/>`; }).join('')).join('');
  }
  const leyenda = t==='pie' ? '' : `<p>${c.series.map((s,k)=>`<span style="color:${COL[k%4]}">■</span> ${esc(s.name)}`).join(' &nbsp; ')}</p>`;
  return `<figure><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(resumen)}" style="width:100%;max-width:420px">${svg}</svg>${leyenda}${figPie(c)}</figure>`;
}
const figPie = c => `<figcaption><small>${esc(c.attrs.caption||'')} ${c.attrs.fictional==='true'?'· <b>Datos ficticios</b>':''}</small></figcaption>`;
function imagenHTML(im, id){
  if(!im) return '<div class="warn">Imagen no cargada.</div>';

  return `<figure>${src?`<img src="${esc(src)}" alt="${esc(im.attrs.alt||'')}" style="max-width:100%;border-radius:12px">`:`<div class="card" role="img" aria-label="${esc(im.attrs.alt||'')}" style="text-align:center;color:var(--mut)">Ilustración: ${esc(im.attrs.alt||'')}</div>`}<figcaption><small>${esc(im.attrs.caption||'')}</small></figcaption></figure>`;
}

/* ---- Bloques ---- */
const hash = s => { let h=0; for(const c of s) h=(h*31+c.charCodeAt(0))>>>0; return h.toString(36); };
function vBloque(b, ctx={noq:true}){
  switch(b.type){
    case 'table': return `<div class="blk"><b>${esc(b.attrs.caption||'')}</b>${renderTabla(b.rows)}</div>`;
    case 'box': return `<div class="blk ${esc(b.attrs.tipo||'')}"><small><b>${{tip:'Consejo',warning:'Cuidado',exam:'Examen',culture:'Cultura'}[b.attrs.tipo]||''}</b></small>${md(b.text)}</div>`;
    case 'vocab': return b.rows.map(v=>`<div class="card"><div class="row"><b class="grow">${esc(v.term)} <small>${esc(v.ipa)}</small></b>${v.ipa?`<button data-act="say" data-t="${esc(v.term)}" aria-label="Pronunciar ${esc(v.term)}">🔊</button>`:''}</div>${esc(v.es)}<br><small>${inline(v.ex)}${v.col?' · '+esc(v.col):''}</small></div>`).join('');
    case 'pron': return `<div class="card"><b>Sonido ${esc(b.attrs.sonido||'')}</b><p>${inline(b.tip)}</p>${b.pares.map(pr=>`<button class="chip" data-act="say" data-t="${esc(pr.join(', '))}">${esc(pr.join(' · '))}</button> `).join('')}</div>`;
    case 'passage': return visible(b) ? `<div class="card"><h3 style="margin-top:0">${esc(b.attrs.title||'')}</h3>${b.text.split(/\n+/).map(p=>`<p>${inline(p)}</p>`).join('')}</div>` : '';
    case 'audio': return audioHTML(b, 'm:'+b.id, {modelo:true});
    case 'image': return imagenHTML(b);
    case 'chart': return chartHTML(b);
    case 'process': return `<ol class="proc">${b.steps.map(s=>`<li>${inline(s)}</li>`).join('')}</ol>`;
    case 'checklist': return `<div class="card">${b.items.map((s,i)=>{ const k='cl:'+hash(b.raw)+':'+i; return `<label class="opt"><input type="checkbox" data-act="cl" data-k="${k}" ${P().checks[k]?'checked':''}> <span>${inline(s)}</span></label>`; }).join('')}</div>`;
    case 'model-answer': return `<div class="card"><small>Respuesta modelo · ${esc(b.attrs.type||'')} ${esc(b.attrs.band?'(aprox. '+b.attrs.band+')':'')}</small>${md(b.text)}</div>`;
    case 'exam': return `<a class="btn pri" href="#/prueba/${esc(b.id)}">${esc(b.attrs.name||'Prueba')}: ${esc(b.attrs.minutes||'')} min</a>`;
    case 'q': return ctx.noq ? '' : (visible(b) ? qHTML(b, ctx.modo||'inline') : '');
    default: return `<div class="blk"><span class="tag">${esc(b.type)}${b.id?' · '+esc(b.id):''}</span></div>`;
  }
}
const vItems = (items, ctx) => items.map(i=>i.t==='md'?md(i.text):vBloque(i.b, ctx)).join('');

/* ---- Pregunta ---- */
function initResp(b){
  switch(b.qtype){
    case 'mcq-multi': return [];
    case 'match': return {};
    case 'label': return ['','','','',''];
    case 'order': { const it=lista((b.f.items||'').replace(/\//g,',')); const m=mezclar(it,b.id); return nz(m.join(' '))===nz(b.f.answer) ? [...m.slice(1),m[0]] : m; }
    default: return '';
  }
}
function recursosQ(b){
  const a=b.attrs, rev=!!RS[b.id]&&(QM[b.id]==='inline'||REV[b.id]); let h='';
  const falta = (id,k) => `<div class="warn">${k} ${esc(id)} no está cargado.</div>`;
  if(a.audio){ const x=curso.byId.get(a.audio); h += x ? audioHTML(x,'q:'+b.id,{rev,practica:a.mode==='practice'}) : falta(a.audio,'Audio'); }
  if(a.passage){ const x=curso.byId.get(a.passage); h += x ? `<details open><summary>Texto: ${esc(x.attrs.title||x.id)}</summary>${x.text.split(/\n+/).map(p=>`<p>${inline(p)}</p>`).join('')}</details>` : falta(a.passage,'Texto'); }
  if(a.chart) h += chartHTML(curso.byId.get(a.chart)) ;
  if(a.image) h += imagenHTML(curso.byId.get(a.image));
  return h;
}
function cuerpoQ(b, r){
  const id=b.id, f=b.f, t=b.qtype;
  const ta = (min) => `<textarea id="ta-${id}" data-r="v" data-q="${id}" rows="${t==='write'?9:5}" style="width:100%;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px;font:inherit" aria-label="Tu respuesta">${esc(r)}</textarea><small id="cnt-${id}">${palabras(r)} palabras</small>${min?` <small>· mínimo ${min}</small>`:''}`;
  const mic = (t==='speak'||t==='repeat') ? `<button data-act="mic" data-q="${id}">🎤 Dictar</button>` : '';
  switch(t){
    case 'mcq': return b.options.map(o=>`<label class="opt"><input type="radio" name="r-${id}" data-r="v" data-q="${id}" value="${o.k}" ${r===o.k?'checked':''}> <span>${o.k}) ${txt(o.t)}</span></label>`).join('');
    case 'mcq-multi': return b.options.map(o=>`<label class="opt"><input type="checkbox" data-r="m" data-q="${id}" value="${o.k}" ${r.includes(o.k)?'checked':''}> <span>${o.k}) ${txt(o.t)}</span></label>`).join('');
    case 'tfng': case 'ynng': return `<div class="row" role="group">${{tfng:['TRUE','FALSE','NOT GIVEN'],ynng:['YES','NO','NOT GIVEN']}[t].map(v=>`<button class="chip ${nz(r)===nz(v)?'on':''}" data-act="tf" data-q="${id}" data-v="${v}" aria-pressed="${nz(r)===nz(v)}">${v}</button>`).join('')}</div>`;
    case 'fill': case 'short': return `<input type="text" data-r="v" data-q="${id}" value="${esc(r)}" autocomplete="off" autocapitalize="off" aria-label="Respuesta">${f.limit?`<small>Límite: ${esc(f.limit)}</small>`:''}`;
    case 'fillbank': return `<select data-r="v" data-q="${id}" aria-label="Elige"><option value="">—</option>${lista(f.bank).map(x=>`<option ${r===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
    case 'match': { const ks=lista(f.pairs).map(p=>p.split('-')[0].trim()), L='ABCDEFGH'.slice(0,Math.max(ks.length,3)).split('');
      return ks.map(k=>`<div class="row"><b>${esc(k)}</b><select data-r="k" data-q="${id}" data-k="${esc(k)}" aria-label="Pareja de ${esc(k)}"><option value="">—</option>${L.map(x=>`<option ${r[k]===x?'selected':''}>${x}</option>`).join('')}</select></div>`).join(''); }
    case 'order': return `<ol>${r.map((x,i)=>`<li class="row"><span class="grow">${esc(x)}</span><button data-act="mov" data-q="${id}" data-i="${i}" data-d="-1" aria-label="Subir">↑</button><button data-act="mov" data-q="${id}" data-i="${i}" data-d="1" aria-label="Bajar">↓</button></li>`).join('')}</ol>`;
    case 'label': return r.map((x,i)=>`<div class="row"><b>${i+1}</b><input type="text" data-r="i" data-q="${id}" data-i="${i}" value="${esc(x)}" aria-label="Marcador ${i+1}"></div>`).join('');
    case 'repeat': return `<div class="row"><button data-act="sayq" data-q="${id}">🔊 Escuchar modelo</button>${mic}</div><p><small>Repite en voz alta; puedes corregir la transcripción.</small></p>${ta(0)}`;
    default: return `${(t==='speak'&&f.turns)?`<p><small>${txt(f.turns)}</small></p>`:''}<div class="row">${mic}</div>${ta(minPal(b))}`;
  }
}
function feedbackQ(b, rs){
  if(!rs) return '';
  if(rs.cargando) return '<div class="warn">Evaluando…</div>';
  let h = '';
  if(rs.pend){
    h += `<div class="blk"><b>Autoevaluación guiada</b> <small>(no hay IA disponible)</small>${b.f.sample?`<details><summary>Ver respuesta modelo</summary>${txt(b.f.sample)}</details>`:''}<p>${txt(b.f.rubric||'')}</p>
    ${lista(b.f.key_ideas).map(k=>`<label class="opt"><input type="checkbox"> <span>${inline(k)}</span></label>`).join('')}
    <div class="row"><button class="pri" data-act="auto" data-q="${b.id}" data-v="1">Cumplí los criterios</button><button data-act="auto" data-q="${b.id}" data-v="0">Aún me falta</button></div></div>`;
  } else if(rs.ok!=null){
    h += `<div class="${rs.ok?'tag ok':'warn'}" style="display:block;border-radius:12px;padding:8px 12px">${rs.ok?'✓ Lograda':'Por mejorar'}${rs.auto?' · autoevaluada':''}${rs.msg?' — '+esc(rs.msg):''}</div>`;
    if(rs.c) h += `<p>${esc(rs.c)}</p>`;
    if(rs.fuertes?.length) h += `<p><b>Bien:</b> ${rs.fuertes.map(esc).join('; ')}</p>`;
    if(rs.mejorar?.length) h += `<p><b>Mejorar:</b> ${rs.mejorar.map(esc).join('; ')}</p>`;
    if(rs.banda) h += `<p><small>Banda aprox.: ${esc(rs.banda)} (orientativa, no es un puntaje oficial)</small></p>`;
    if(!esAbierta(b) && !rs.ok && b.qtype!=='repeat') h += `<p><b>Respuesta:</b> ${esc(respTexto(b))}</p>`;
  } else if(rs.msg) h += `<div class="warn">${esc(rs.msg)}</div>`;
  if(rs.ok!=null && b.f.explain) h += `<p><small>${txt(b.f.explain)}</small></p>`;
  if(rs.ok!=null && (b.qtype==='speak'||b.qtype==='repeat')) h += `<details><summary>Pronunciación (autoevaluación)</summary><p><small>La plataforma solo recibe texto: no evalúa tu pronunciación. Escucha el modelo, grábate con tu dispositivo y marca:</small></p>${['Imité el ritmo y la entonación','Pronuncié claro los sonidos difíciles','Me entendería un hablante nativo'].map(x=>`<label class="opt"><input type="checkbox"> <span>${x}</span></label>`).join('')}</details>`;
  return h;
}
function qHTML(b, ctx){
  QM[b.id]=ctx; if(!(b.id in Q)) Q[b.id]=initResp(b);
  const rs=RS[b.id], mostrar = rs && (ctx==='inline' || REV[b.id]), prev=P().respuestas[b.id];
  const boton = ctx==='inline' && !(rs?.pend) ? `<button class="pri" data-act="chk" data-q="${b.id}">${esAbierta(b)?'Enviar':'Comprobar'}</button>` : '';
  return `<div class="card q" id="q-${b.id}"><small>${esc(b.id)} · ${esc(b.attrs.skill||'')}${b.attrs.mode==='graded'?' · con nota':''}${prev?.ok&&!rs?' · <b style="color:var(--ok)">✓ lograda antes</b>':''}</small>${recursosQ(b)}${b.f.stem?`<p><b>${txt(b.f.stem)}</b></p>`:''}${cuerpoQ(b,Q[b.id])} <div class="row">${boton}</div>${mostrar?feedbackQ(b,rs):''}</div>`;
}
const refrescarQ = id => { const el=document.getElementById('q-'+id), b=curso.byId.get(id); if(el&&b) el.outerHTML = qHTML(b, QM[id]||'inline'); };

/* ---- Registro, conjuntos (evaluación de unidad / pruebas) ---- */
function registrar(b, ok, extra={}){
  const prev = P().respuestas[b.id];
  P().respuestas[b.id] = {ok, t:Date.now(), ...extra}; sumarXP(0);
  if(ok){ delete P().errores[b.id]; if(!prev?.ok) sumarXP(b.attrs.mode==='graded'?10:5); } else if(ok===false) P().errores[b.id]=1;
  guardarEstado(); actualizarConjuntos(); if(b.unit) actualizarPasos(b.unit);
}
async function enviarAbierta(id, forzado){
  const b=curso.byId.get(id), t=(Q[id]||'').trim(), min=minPal(b), pal=palabras(t);
  if(pal<min){
    if(!forzado){ RS[id]={ok:null, msg:`Escribe al menos ${min} palabras (llevas ${pal}).`}; return refrescarQ(id); }
    RS[id]={ok:false, msg:`Respuesta corta (${pal} de ${min} palabras).`}; registrar(b,false); return refrescarQ(id);
  }
  RS[id]={cargando:true}; refrescarQ(id);
  const j = await aiJudge(b,t);
  if(j){ RS[id]={ok:!!j.aprobado, c:j.comentario, fuertes:j.puntos_fuertes, mejorar:j.mejorar, banda:j.banda_aproximada}; registrar(b,RS[id].ok,{c:j.comentario}); }
  else RS[id]={pend:true, ok:null};
  refrescarQ(id); actualizarConjuntos();
}
async function comprobar(id){
  const b=curso.byId.get(id); if(esAbierta(b)) return enviarAbierta(id);
  const e=evalQ(b,Q[id]); RS[id]={ok:e.ok, msg:e.msg}; registrar(b,e.ok); refrescarQ(id);
}
async function terminarConjunto(key){
  const c=CONJ[key]; c.fin=true;
  c.qs.forEach(id=>{ const b=curso.byId.get(id); REV[id]=true; if(!esAbierta(b)){ const e=evalQ(b,Q[id]); RS[id]={ok:e.ok,msg:e.msg}; registrar(b,e.ok); } });
  c.qs.forEach(refrescarQ);
  for(const id of c.qs) if(esAbierta(curso.byId.get(id))){ await enviarAbierta(id,true); }
  actualizarConjuntos();
}
function calcConjunto(c){
  const qs=c.qs.map(id=>curso.byId.get(id)), cer=qs.filter(b=>!esAbierta(b)), ab=qs.filter(esAbierta);
  const okc=cer.filter(b=>RS[b.id]?.ok).length, pct=cer.length?Math.round(100*okc/cer.length):0, okA=ab.filter(b=>RS[b.id]?.ok===true).length, pend=ab.filter(b=>RS[b.id]?.ok==null).length;
  return {qs,cer,ab,okc,pct,okA,pend, pass: c.umbral!=null && pct>=c.umbral && okA===ab.length};
}
function cerrarConjunto(key, c, r){
  c.cerrado=true; const intento={t:Date.now(), pct:r.pct, ok:r.pass};
  if(c.tipo==='unidad'){
    const u = P().unidades[c.n] ||= {hist:[], mejor:0}; u.hist.push(intento); u.mejor=Math.max(u.mejor,r.pct);
    if(r.pass && !u.completa){ u.completa=true; sumarXP(50); celebrar('¡Unidad completada!'); }
  } else if(c.tipo==='prueba'){
    const x = P().pruebas[c.id] ||= {hist:[], mejor:0}; x.hist.push(intento); x.mejor=Math.max(x.mejor,r.pct);
    if(c.umbral!=null && r.pass && !x.ok){ x.ok=true; sumarXP(100); celebrar('¡Nivel superado!'); }
  }
  guardarEstado(); if(c.n) actualizarPasos(c.n);
}
function actualizarConjuntos(){
  for(const [key,c] of Object.entries(CONJ)){
    if(!c.fin) continue; const r=calcConjunto(c);
    if(!c.cerrado && r.pend===0) cerrarConjunto(key,c,r);
    const el=document.getElementById('res-'+key); if(el) el.innerHTML=resumenHTML(key,c,r);
  }
}
function resumenHTML(key, c, r){
  let h = `<div class="card"><h3 style="margin-top:0">Resultado: ${r.pct}% en preguntas cerradas (${r.okc} de ${r.cer.length})</h3>`;
  if(r.ab.length) h += `<p>Respuestas abiertas o habladas aprobadas: ${r.okA} de ${r.ab.length}${r.pend?` · <b>faltan ${r.pend} por evaluar</b>`:''}</p>`;
  if(c.tipo==='ubic'){
    const nv = nivelesDe(curso).filter(l=>l.cargado).map(l=>{ const q=r.cer.filter(b=>l.units.includes(b.unit)); return q.length?{l,p:Math.round(100*q.filter(b=>RS[b.id]?.ok).length/q.length)}:null; }).filter(Boolean);
    const rec = (nv.find(x=>x.p<60)||nv[nv.length-1])?.l;
    h += `<p>${nv.map(x=>`${x.l.id}: ${x.p}%`).join(' · ')}</p>${rec?`<p>Te recomendamos empezar en <b>${rec.id}</b>. Es una orientación, no un diagnóstico.</p><button class="pri" data-act="inicio" data-v="${rec.units[0]}">Empezar en ${rec.nombre||rec.id}</button>`:''}</div>`;
    return h;
  }
  if(r.pend===0){
    h += r.pass ? `<p class="tag ok" style="display:block;padding:8px">✓ Superaste el mínimo de ${c.umbral}% y las tareas abiertas.</p>`
      : `<p class="warn">Aún no llegas al mínimo (${c.umbral}% y todas las tareas abiertas aprobadas). Repasa y vuelve a intentarlo.</p>`;
    const malas = r.cer.filter(b=>!RS[b.id]?.ok), sk = {}; malas.forEach(b=>{ (sk[b.attrs.skill||'general'] ||= []).push(b.id); });
    if(!r.pass && malas.length) h += '<p><b>Qué repasar:</b></p><ul>'+Object.entries(sk).map(([k,v])=>`<li>${esc(k)}: ${v.map(esc).join(', ')}</li>`).join('')+'</ul>';
    h += `<button data-act="reint" data-k="${esc(key)}">Intentar de nuevo</button>`;
  }
  if(c.tipo==='prueba') h += resultadoPrueba(c, r);
  return h+'</div>';
}
function resultadoPrueba(c, r){
  const sk={}; r.qs.forEach(b=>{ const k=b.attrs.skill||'general'; const o=sk[k] ||= {n:0,ok:0}; o.n++; if(RS[b.id]?.ok) o.ok++; });
  let h = '<h3>Por habilidad</h3>'+Object.entries(sk).map(([k,o])=>`<p>${esc(k)}: ${o.ok}/${o.n}<div class="bar"><i style="width:${100*o.ok/o.n}%"></i></div></p>`).join('');
  const doc = curso.docs.get(c.nivel);
  const sec = doc?.docSections.find(s=>/lograr/i.test(s.title));
  if(sec && r.pend===0){
    const enun = [...sec.items.map(i=>i.text||'').join('\n').matchAll(/^\s*(\d+)\.\s+(.*)$/gm)].map(m=>[+m[1],m[2]]);
    h += '<h3>Logros comprobados</h3>'+enun.map(([n,t])=>{ const qs=r.qs.filter(b=>+b.attrs.logro===n); const ok=qs.length&&qs.every(b=>RS[b.id]?.ok);
      return `<div class="${ok?'tag ok':qs.length?'warn':'tag'}" style="display:block;margin:4px 0;border-radius:10px;padding:6px 10px">${ok?'✓':qs.length?'Por mejorar':'Sin preguntas'} · ${inline(t)}</div>`; }).join('');
  }
  const tb = doc?.blocks.find(b=>b.type==='table' && /no lo lograste/i.test(b.attrs.caption||''));
  if(tb && !r.pass && r.pend===0) h += `<h3>Si no lo lograste</h3>`+renderTabla(tb.rows).replace(/(Unidad(?:es)?\s+)([\d\s,y–-]+)/g,(m,a,nums)=>a+nums.replace(/\d+/g,n=>`<a href="#/unidad/${n}">${n}</a>`));
  return h;
}
function reintentar(key){
  const c=CONJ[key]; c.qs.forEach(id=>{ delete Q[id]; delete RS[id]; delete REV[id]; delete P().respuestas[id]; });
  c.fin=false; c.cerrado=false; guardarEstado(); render();
}

/* ---- Desbloqueos y progreso ---- */
function pasoHecho(u, i){
  const qs = qsDe(u.sections[i].items);
  if(qs.length) return /^evaluacion/.test(normTit(u.sections[i].title)) ? !!P().unidades[u.n]?.completa : qs.every(b=>P().respuestas[b.id]);
  return !!P().pasos[u.n]?.[i];
}
function actualizarPasos(n){
  const u=curso.units.get(+n); if(!u) return; let hechos=0;
  document.querySelectorAll(`details.paso[data-n="${n}"]`).forEach(d=>{ const ok=pasoHecho(u,+d.dataset.i); if(ok) hechos++; d.querySelector('summary .mk').textContent = ok?'✓':'○'; d.querySelector('summary .mk').style.color = ok?'var(--ok)':'var(--mut)'; });
  const bar=document.getElementById('bar-'+n); if(bar) bar.style.width = Math.round(100*hechos/u.sections.length)+'%';
}
function minSeg(s){ const w=s.items.reduce((a,i)=>a+palabras(i.t==='md'?i.text:(i.b.raw||'')),0); return Math.min(45, Math.max(5, Math.round(w*0.15))); }

/* ---- Pantallas ---- */
const RANGOS = [[0,'Principiante'],[200,'Explorador'],[600,'Constante'],[1500,'Avanzado'],[3000,'Experto']];
const semana = () => Array.from({length:7},(_,i)=>{ const d=new Date(); d.setDate(d.getDate()-(6-i)); return d.toISOString().slice(0,10); });

let EXA = null;
function parseExam(b){
  const secs=[];
  b.raw.split('\n').forEach(l=>{
    const m=/^\s*([^:]+):\s*(.*)$/.exec(l); if(!m) return; const ids=[];
    const resto=m[2].replace(/(EX-[A-Z0-9]+-Q)(\d+)\s+a\s+EX-[A-Z0-9]+-Q(\d+)/g,(x,p,a,z)=>{ for(let i=+a;i<=+z;i++) ids.push(p+pad2(i)); return ''; });
    (resto.match(/EX-[A-Z0-9]+-Q\d+/g)||[]).forEach(x=>ids.push(x));
    if(ids.length) secs.push({name:m[1].trim(), ids, min:[...m[2].matchAll(/(\d+)\s*min/g)].reduce((a,x)=>a+ +x[1],0)||null});
  });
  const ruta = /ielts academic|general training|toefl/i;
  return secs.some(s=>ruta.test(s.name)) ? secs.filter(s=>!ruta.test(s.name) || (metaCurso()==='academic'&&/academic/i.test(s.name)) || (metaCurso()==='general'&&/general/i.test(s.name)) || (metaCurso()==='toefl'&&/toefl/i.test(s.name))) : secs;
}

/* Niveles = documentos del curso (A1…C2 son solo identificadores técnicos) */
function nivelesDe(m){
  const por = {}; m.units.forEach(u=>{ (por[u.doc || CODES[Math.min(5,Math.floor((u.n-1)/6))]] ||= []).push(u.n); });
  m.docs.forEach((d,id)=>{ por[id] ||= []; });
  let tot = 0; m.docs.forEach(d=>{ tot = Math.max(tot, +String(d.meta.doc||'').split('/')[1]||0); });
  const idx = Object.keys(por).map(id=>CODES.indexOf(id)), max = Math.max(tot, idx.length ? Math.max(...idx)+1 : 0), out = [];
  for(let i=0;i<max;i++){ const id=CODES[i], us=(por[id]||[]).sort((a,b)=>a-b), d=m.docs.get(id); out.push({id, nombre:d?.meta.nombre||'', units:us, cargado:us.length>0||!!d}); }
  return out;
}
function desbloqueada(n, m=curso, pr=P()){

  const niv = nivelesDe(m).filter(l=>l.cargado), l = niv.find(x=>x.units.includes(n)); if(!l) return true;
  const i = l.units.indexOf(n); if(i>0) return !!pr.unidades[l.units[i-1]]?.completa;
  const prev = niv[niv.indexOf(l)-1]; if(!prev) return true;
  const ex = 'EX-'+prev.id+'-1';
  return m.byId.has(ex) ? !!pr.pruebas[ex]?.ok : prev.units.every(u=>pr.unidades[u]?.completa);
}
function avance(cid){
  const m = modelos[cid], pr = PC(cid); let tot=0, ok=0, hechas=0;

  nivelesDe(m).filter(l=>l.cargado).forEach(l=>{ const ex='EX-'+l.id+'-1'; if(m.byId.has(ex)){ tot+=30; if(pr.pruebas[ex]?.ok) ok+=30; } });
  const sig = [...m.units.keys()].sort((a,b)=>a-b).find(n=>!pr.unidades[n]?.completa && desbloqueada(n,m,pr));
  return {pct: !tot ? 0 : ok>=tot ? 100 : Math.min(99,Math.round(100*ok/tot)), hechas, total:m.units.size, sig};
}

    for(const p of pendientes.packs){ const cid=destinoFinal(p); tocados.add(cid); if(!antes.has(cid) && nom && !p.declCurso) (S.cursosInfo[cid] ||= {}).nombre = nom; await guardarPack(asignar({...p}, cid)); }
    const n = pendientes.packs.length, nuevo = [...tocados].find(c=>!antes.has(c)); pendientes=null; await recargarCurso();
    toast(n+' paquete(s) guardados'); if(nuevo){ activar(nuevo); location.hash='#/curso/'+nuevo; } else render();
  }
  if(act==='borrar' && confirm('¿Quitar este paquete? Tu progreso se conserva.')){ await borrarPack(el.dataset.k); await recargarCurso(); render(); }
  if(act==='borrarcurso' && confirm('¿Eliminar este curso con todos sus paquetes Y su progreso? No se puede deshacer.')){
    const c=el.dataset.c; for(const q of [...packs.values()].filter(q=>q.curso===c)) await borrarPack(q.key);
    delete S.cursos[c]; delete S.cursosInfo[c]; if(S.activo===c) S.activo=''; await recargarCurso(); render(); }
});
window.addEventListener('hashchange', render);

/* ============ 9. APP INSTALABLE (PWA) ============ */
let DEFER = null, PERSIST = null;
const estadoApp = () => (matchMedia('(display-mode: standalone)').matches || navigator.standalone ? 'Abierta como app. ' : 'Aún no instalada. ')
  + (PERSIST ? 'Almacenamiento protegido.' : 'Almacenamiento NO protegido: la app funciona igual, pero exporta tu copia cada semana.');
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); DEFER = e; if(location.hash==='#/perfil') render(); });
if(navigator.storage?.persist) navigator.storage.persist().then(v=>{ PERSIST=v; const e=$('#pst'); if(e) e.textContent=estadoApp(); }).catch(()=>{});
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(()=>{});

/* ============ 10. ARRANQUE ============ */
(async function(){
  aplicarAjustes();
  _db = await abrirDB();
  if(!_db) toast('Este navegador no permite guardar el curso; el contenido durará solo esta sesión');
  await recargarCurso(); render();
})();
</script>
